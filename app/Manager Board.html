  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><\u002Fdiv>\n        <div style=\"{{ hamburgerLineStyle }}\"><\u002Fdiv>\n        <div style=\"{{ hamburgerLineStyle }}\"><\u002Fdiv>\n      <\u002Fbutton>\n      <div style=\"{{ menuLabelStyle }}\">{{ wsLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div onclick=\"{{ onCloseMenu }}\" style=\"{{ menuOverlayStyle }}\"><\u002Fdiv>\n      <div style=\"{{ menuPanelStyle }}\">\n        <sc-for list=\"{{ topTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ t.onClick }}\" style=\"{{ t.menuStyle }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isLanding }}\">\n    <div style=\"padding:36px 26px;max-width:1100px;margin:0 auto;color:#eef2f7;\">\n      <div style=\"margin-bottom:24px;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;color:#eef2f7;\">Rotation Tracker<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:14px;margin-top:4px;\">Choose an area, or see today's stats at a glance.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start;\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ landingCards }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ c.onClick }}\" style=\"{{ c.cardStyle }}\">\n              <div style=\"{{ c.barStyle }}\"><\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;color:#eef2f7;\">{{ c.label }}<\u002Fdiv>\n              <div style=\"color:#9aa4b2;font-size:11px;margin-top:3px;\">{{ c.sub }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;\">\n            <div style=\"display:flex;gap:8px;\" data-print-hide=\"1\">\n              <sc-for list=\"{{ landingDays }}\" as=\"dd\" hint-placeholder-count=\"5\">\n                <button onclick=\"{{ dd.onClick }}\" style=\"{{ dd.style }}\">{{ dd.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ filterChips }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <span onclick=\"{{ f.onToggle }}\" style=\"{{ f.chipStyle }}\">{{ f.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasAreaStats }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;\">\n              <sc-for list=\"{{ areaStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"background:#191d24;border:1px solid #2c333f;border-top:4px solid {{ s.color }};border-radius:12px;padding:16px 18px;\">\n                  <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:#eef2f7;margin-bottom:8px;\">{{ s.label }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:8px;\">\n                    <span style=\"{{ s.pctStyle }}\">{{ s.pct }}%<\u002Fspan>\n                    <span style=\"color:#7f8a99;font-size:12px;\">{{ s.achieved }} / {{ s.goal }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:8px;\"><div style=\"{{ s.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !hasAreaStats }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#7f8a99;font-size:14px;background:#191d24;border:1px solid #2c333f;border-radius:12px;padding:24px;text-align:center;\">All areas filtered out — toggle one back on above to see stats.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"color:#7f8a99;font-size:12px;margin-top:14px;\">Goal vs. achieved for {{ landingDayLong }}, across each area's goal categories.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ !isLanding }}\">\n  <div style=\"padding:22px 26px 0;\">\n\n  <sc-if value=\"{{ newBuilderModal.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(6,8,11,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:16px;padding:26px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;margin-bottom:4px;\">New builder<\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-bottom:18px;\">From an unassigned {{ newBuilderModal.pathLabel }} alias. Fill in whatever's missing.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">Name<\u002Fdiv>\n            <input value=\"{{ newBuilderModal.name }}\" onchange=\"{{ newBuilderModal.onName }}\" placeholder=\"Builder name\" style=\"width:100%;min-height:44px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;padding:0 12px;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">Role<\u002Fdiv>\n            {{ newBuilderModal.roleEl }}\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">Alias (import)<\u002Fdiv>\n            <input value=\"{{ newBuilderModal.alias }}\" onchange=\"{{ newBuilderModal.onAlias }}\" placeholder=\"alias / login (comma for more)\" style=\"width:100%;min-height:44px;background:#161b22;border:1px solid #2c333f;border-radius:8px;color:#ffcf9a;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;padding:0 12px;\">\n          <\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;\">\n            <input type=\"checkbox\" checked=\"{{ newBuilderModal.partner }}\" onchange=\"{{ newBuilderModal.onPartner }}\" style=\"width:20px;height:20px;accent-color:#b98cff;cursor:pointer;\">\n            <span style=\"color:#cdd5df;font-size:14px;font-weight:600;\">Partner<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;margin-top:22px;\">\n          <button onclick=\"{{ newBuilderModal.onCreate }}\" disabled=\"{{ !newBuilderModal.canCreate }}\" style=\"{{ accentBtnStyle }}\">Create builder<\u002Fbutton>\n          <button onclick=\"{{ newBuilderModal.onCancel }}\" style=\"{{ ghostBtnStyle }}\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ trainingPopup.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ trainingPopup.onClose }}\" style=\"position:fixed;inset:0;background:rgba(6,8,11,.7);z-index:39;\"><\u002Fdiv>\n    <div style=\"position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:16px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);pointer-events:auto;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;margin-bottom:16px;\">{{ trainingPopup.name }}<\u002Fdiv>\n        <sc-if value=\"{{ trainingPopup.hasTrainings }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ trainingPopup.trainings }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"padding:12px 14px;border-radius:8px;background:#161b22;\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;\">\n                  <span style=\"display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:#2a1f38;color:#e0a8ff;\">{{ t.area }}<\u002Fspan>\n                  <span style=\"font-weight:700;font-size:14px;color:#eef2f7;\">{{ t.name }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:14px;color:#9aa4b2;font-size:11px;\">\n                  <span>OJT: {{ t.ojt }}<\u002Fspan>\n                  <span>EA: {{ t.ea }}<\u002Fspan>\n                  <span>PA: {{ t.pa }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ !trainingPopup.hasTrainings }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"color:#7f8a99;font-size:14px;\">No skills recorded yet. Add them from the Training area.<\u002Fdiv>\n        <\u002Fsc-if>\n        <button onclick=\"{{ trainingPopup.onClose }}\" style=\"margin-top:20px;width:100%;{{ ghostBtnStyle }}\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ addSkillModal.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ addSkillModal.onCancel }}\" style=\"position:fixed;inset:0;background:rgba(6,8,11,.7);z-index:39;\"><\u002Fdiv>\n    <div style=\"position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:16px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);pointer-events:auto;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;margin-bottom:4px;\">Add skill<\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-bottom:18px;\">For {{ addSkillModal.personName }} — recording this means they're learning it now.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">Skill<\u002Fdiv>\n            {{ addSkillModal.skillSelectEl }}\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;\">\n            <div>\n              <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">OJT<\u002Fdiv>\n              <input value=\"{{ addSkillModal.ojt }}\" onchange=\"{{ addSkillModal.onOjt }}\" style=\"width:100%;min-height:40px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;padding:0 10px;\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">EA<\u002Fdiv>\n              <input value=\"{{ addSkillModal.ea }}\" onchange=\"{{ addSkillModal.onEa }}\" style=\"width:100%;min-height:40px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;padding:0 10px;\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;\">PA<\u002Fdiv>\n              <input value=\"{{ addSkillModal.pa }}\" onchange=\"{{ addSkillModal.onPa }}\" style=\"width:100%;min-height:40px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;padding:0 10px;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;margin-top:22px;\">\n          <button onclick=\"{{ addSkillModal.onSave }}\" disabled=\"{{ !addSkillModal.canSave }}\" style=\"{{ accentBtnStyle }}\">Save skill<\u002Fbutton>\n          <button onclick=\"{{ addSkillModal.onCancel }}\" style=\"{{ ghostBtnStyle }}\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;\">\n      <div style=\"{{ barStyle }}\"><\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;line-height:1;text-transform:uppercase;\">{{ title }}<\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\" data-print-hide=\"1\">\n      <label style=\"display:flex;align-items:center;gap:8px;background:#191d24;border:1px solid #2c333f;border-radius:10px;padding:8px 14px;\">\n        <span style=\"color:#9aa4b2;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Week of<\u002Fspan>\n        <input type=\"date\" value=\"{{ weekOf }}\" onchange=\"{{ onWeekOf }}\" style=\"background:transparent;border:none;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;width:150px;color-scheme:dark;\">\n      <\u002Flabel>\n      <button onclick=\"{{ onPrint }}\" style=\"{{ ghostBtnStyle }}\">Print<\u002Fbutton>\n      <sc-if value=\"{{ showInner }}\" hint-placeholder-val=\"{{ true }}\">\n        <button onclick=\"{{ onExportDayExcel }}\" style=\"{{ accentBtnStyle }}\">⬇ Export Day (Excel)<\u002Fbutton>\n        <button onclick=\"{{ onClear }}\" style=\"background:#2a1618;color:#ff8079;border:1px solid #4a2327;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;font-family:'Barlow',sans-serif;\">Clear week<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showInner }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:6px;border-bottom:2px solid #2c333f;margin-bottom:18px;\" data-print-hide=\"1\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDays }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:10px;margin-bottom:20px;\" data-print-hide=\"1\">\n      <sc-for list=\"{{ days }}\" as=\"dd\" hint-placeholder-count=\"5\">\n        <button onclick=\"{{ dd.onClick }}\" style=\"{{ dd.style }}\">{{ dd.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= ROTATION ================= -->\n  <sc-if value=\"{{ isRotation }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-if value=\"{{ showRotationKpis }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px;max-width:560px;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n        <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Builders Present<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;margin-top:6px;\">{{ presentCount }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n        <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Assigned to a Path<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;margin-top:6px;\">{{ assigned }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\">\n        <div style=\"{{ barSm }}\"><\u002Fdiv>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em;\">Rotation — {{ dayLong }}<\u002Fspan>\n        {{ copyDayEl }}\n      <\u002Fdiv>\n      <div style=\"{{ rotHeadStyle }}\">\n        <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;\">Builder<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Q1 · 8:00–10:30<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Q2 · 11:00–1:30<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Q3 · 2:00–4:30<\u002Fdiv>\n        <sc-if value=\"{{ showPartnerCol }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;color:#b98cff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Partner<\u002Fdiv>\n        <\u002Fsc-if>\n        <div><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ rotRows }}\" as=\"row\" hint-placeholder-count=\"12\">\n        <div style=\"{{ row.rowStyle }}\">\n          <div style=\"display:flex;flex-direction:column;min-width:0;\">\n            <span style=\"font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ row.name }}<\u002Fspan>\n            <span style=\"color:#7f8a99;font-size:12px;\">{{ row.role }}<\u002Fspan>\n          <\u002Fdiv>\n          {{ row.q1el }}\n          {{ row.q2el }}\n          {{ row.q3el }}\n          <sc-if value=\"{{ row.showPartner }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;align-items:center;justify-content:center;min-height:46px;cursor:pointer;\" title=\"Mark as partner for this day\">\n              <input type=\"checkbox\" checked=\"{{ row.partnerDay }}\" onchange=\"{{ row.onPartnerDay }}\" style=\"width:20px;height:20px;accent-color:#b98cff;cursor:pointer;\">\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <button onclick=\"{{ row.onFill }}\" title=\"Fill all three quarters from Q1\" style=\"min-height:46px;background:#20262f;border:1px solid #2c333f;border-radius:8px;color:#cdd5df;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;\">All<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= BOARD ================= -->\n  <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em;\">Assignment Board — {{ dayLong }}<\u002Fspan>\n      <span style=\"color:#7f8a99;font-size:14px;font-weight:600;\">{{ boardPresent }} present<\u002Fspan>\n      {{ copyDayEl }}\n    <\u002Fdiv>\n    <sc-if value=\"{{ boardEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:48px 30px;text-align:center;color:#7f8a99;font-size:15px;\">No one is on the roster yet. Add builders in Setup, then assign paths on the Rotation tab.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ !isFaBoard }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"column-count:3;column-gap:16px;\">\n        <sc-for list=\"{{ boardCards }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"{{ c.cardStyle }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid #20262f;\">\n              <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;color:#eef2f7;\">{{ c.name }}<\u002Fspan>\n              <span style=\"{{ c.countStyle }}\">{{ c.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ c.people }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div onclick=\"{{ p.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;cursor:pointer;\">\n                <span style=\"font-weight:600;font-size:15px;color:#eef2f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-decoration-color:#2c333f;\">{{ p.name }}<\u002Fspan>\n                <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- FA: organized by component (Dongle / PSU / DIMM / Switch / Other), with a\n         tester ">\n            <sc-for list=\"{{ g.cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"{{ c.cardStyle }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid #20262f;\">\n                  <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;color:#eef2f7;\">{{ c.name }}<\u002Fspan>\n                  <span style=\"{{ c.countStyle }}\">{{ c.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ c.people }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:5px 0;\">\n                    <div onclick=\"{{ p.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;\">\n                      <span style=\"font-weight:600;font-size:14px;color:#eef2f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-decoration-color:#2c333f;\">{{ p.name }}<\u002Fspan>\n                      <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ p.machineEl }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div>{{ p.machineEl }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ boardSections.awayCard }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ boardSections.awayCard.cardStyle }}\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid #20262f;\">\n            <span style=\"font-family:'Barlow Condensed', r>\n      <div style=\"display:grid;grid-template-columns:minmax(190px,2fr) repeat(5,1fr);gap:8px;align-items:center;padding:12px 0 2px;border-top:2px solid #2c333f;margin-top:6px;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;\">Total (counted)<\u002Fdiv>\n        <div style=\"text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;\">{{ hcTotal.p1 }}<\u002Fdiv>\n        <div style=\"text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;\">{{ hcTotal.p2 }}<\u002Fdiv>\n        <div style=\"text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;\">{{ hcTotal.p3 }}<\u002Fdiv>\n        <div style=\"text-align:center;font-size:18px;font-weight:700;color:#9aa4b2;font-variant-numeric:tabular-nums;\">{{ hcTotal.totalHours }}<\u002Fdiv>\n        <div style=\"text-align:center;font-size:18px;font-weight:700;color:#9aa4b2;font-variant-numeric:tabular-nums;\">{{ hcTotal.hcDay }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"color:#7f8a99;font-size:13px;margin-top:14px;line-height:1.5;\">{{ hcNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= UPLOAD ================= -->\n  <sc-if value=\"{{ isUpload }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-bottom:14px;\" data-print-hide=\"1\">\n      <button onclick=\"{{ onBackContrib }}\" style=\"{{ ghostBtnStyle }}\">← Back to contributions<\u002Fbutton>\n    <\u002Fdiv>\n    <label style=\"display:block;cursor:pointer;\" ondrop=\"{{ upload.onDrop }}\" ondragover=\"{{ upload.onDragOver }}\">\n      <input type=\"file\" accept=\".xlsx,.csv\" onchange=\"{{ upload.onFileInput }}\" style=\"display:none;\">\n      <div style=\"border:2px dashed #3a4553;border-radius:16px;background:#161b22;padding:40px 30px;text-align:center;transition:border-color .15s;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.03em;color:#eef2f7;\">Drop Excel or CSV here — {{ dayLong }}<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:15px;margin-top:8px;\">Drag a <strong style=\"color:#cdd5df;\">.xlsx<\u002Fstrong> or <strong style=\"color:#cdd5df;\">.csv<\u002Fstrong> file onto this box, or click to browse. Imports achieved numbers for the selected day.<\u002Fdiv>\n        <div style=\"display:inline-block;margin-top:16px;background:#212630;border:1px solid #2c333f;border-radius:10px;padding:10px 20px;color:#cdd5df;font-weight:700;font-size:14px;\">Choose file…<\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-top:16px;max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5;\">{{ upload.uploadHint }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Flabel>\n\n    <sc-if value=\"{{ upload.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;background:#2a1618;border:1px solid #4a2327;border-radius:12px;padding:16px 20px;color:#ff8079;font-weight:600;\">{{ upload.error }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ upload.hasPreview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;\">\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;\">\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;\">Column mapping<\u002Fdiv>\n            <button onclick=\"{{ upload.onToggleColumnMapping }}\" style=\"background:transparent;border:1px solid #2c333f;border-radius:8px;color:#4aa8ff;font-size:12px;font-weight:700;cursor:pointer;padding:6px 10px;\">{{ upload.columnMappingToggleLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">{{ upload.fileName }} · {{ upload.rowCount }} rows · metric: <strong style=\"color:#cdd5df;\">{{ upload.metricLabel }}<\u002Fstrong><\u002Fdiv>\n          <sc-if value=\"{{ upload.columnMappingExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;\">\n                <span style=\"color:#9aa4b2;font-size:13px;font-weight:600;\">{{ upload.catColLabel }}<\u002Fspan>{{ upload.colCat }}\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;\">\n                <span style=\"color:#9aa4b2;font-size:13px;font-weight:600;\">Alias<\u002Fspan>{{ upload.colAlias }}\n              <\u002Fdiv>\n              <sc-if value=\"{{ upload.showPathAliasCols }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid #20262f;padding-top:12px;margin-top:2px;\">\n                  <button onclick=\"{{ upload.onToggleAliasCols }}\" style=\"{{ upload.aliasColsToggleStyle }}\">{{ upload.aliasColsToggleLabel }}<\u002Fbutton>\n                  <div style=\"color:#7f8a99;font-size:12px;margin-top:4px;\">{{ upload.aliasColsSummary }}<\u002Fdiv>\n                  <sc-if value=\"{{ upload.aliasColsExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:10px;\">\n                      <div style=\"color:#9aa4b2;font-size:12px;margin-bottom:10px;\">Sort and Receive can each pull the alias from a different column, if this file identifies the same person differently per workflow.<\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;margin-bottom:12px;\">\n                        <span style=\"color:#4aa8ff;font-size:13px;font-weight:600;\">Sort alias col.<\u002Fspan>{{ upload.colAliasSort }}\n                      <\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;\">\n                        <span style=\"color:#34d17a;font-size:13px;font-weight:600;\">Receive alias col.<\u002Fspan>{{ upload.colAliasReceive }}\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ upload.metricUnique }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;\">\n                  <span style=\"color:#9aa4b2;font-size:13px;font-weight:600;\">Container ID<\u002Fspan>{{ upload.colId }}\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"border-top:1px solid #20262f;padding-top:12px;margin-top:2px;\">\n                <div style=\"color:#9aa4b2;font-size:12px;margin-bottom:10px;\">Contributions count <b style=\"color:#ff9425;\">day shift only<\u002Fb> ({{ upload.dayWindowLabel }}). Pick the time column for each pathway.<\u002Fdiv>\n                <sc-for list=\"{{ upload.timeRows }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;\">\n                    <span style=\"{{ t.chip }}\">{{ t.cat }}<\u002Fspan>\n                    {{ t.sel }}\n                    <span style=\"{{ t.shiftStyle }}\">{{ t.shiftLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"color:#7f8a99;font-size:12px;\">{{ upload.timeExcludedCount }} row(s) were outside day shift and were excluded.<\u002Fdiv>\n                <sc-if value=\"{{ upload.timeUnreadableCount }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"color:#7f8a99;font-size:12px;margin-top:2px;\">{{ upload.timeUnreadableCount }} row(s) had no readable time and were kept — double-check the time column if that number looks high.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ upload.hasFilter }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;\">\n                  <span style=\"color:#9aa4b2;font-size:13px;font-weight:600;\">Filter column<\u002Fspan>{{ upload.colFilter }}\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid #20262f;padding-top:12px;\">\n                  <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;margin-bottom:8px;\">Keep only these source types<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                    <sc-for list=\"{{ upload.filterRows }}\" as=\"f\" hint-placeholder-count=\"3\">\n                      <span onclick=\"{{ f.onToggle }}\" style=\"{{ f.chipStyle }}\">{{ f.v }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:4px;\">Map {{ upload.catColLabel }} → categories<\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">Each value found (after filtering), mapped to a goal category.<\u002Fdiv>\n          <sc-if value=\"{{ upload.columnMappingExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ upload.ignoredCatCount }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ upload.onToggleHideIgnoredCats }}\" style=\"background:transparent;border:none;color:#4aa8ff;font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-bottom:10px;\">{{ upload.hideIgnoredToggleLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ upload.catRows }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #20262f;\">\n                <span style=\"font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ w.v }}<\u002Fspan>\n                <span style=\"color:#7f8a99;font-size:12px;text-align:center;\">{{ w.count }}<\u002Fspan>\n                {{ w.sel }}\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:16px;background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:14px;\">Preview — {{ dayLong }}<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;\">\n          <sc-for list=\"{{ upload.catTotals }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#161b22;border:1px solid #2c333f;border-radius:12px;padding:12px 18px;\">\n              <div style=\"margin-bottom:6px;\"><span style=\"{{ c.chip }}\">{{ c.cat }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;\">{{ c.total }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:14px;margin-bottom:16px;\">Aliases matched to roster: <strong style=\"color:#34d17a;\">{{ upload.matchedAliases }}<\u002Fstrong> · unmatched: <strong style=\"color:#ff9425;\">{{ upload.unmatchedAliases }}<\u002Fstrong> (fix these under Contributions or Setup → Alias).<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;\">\n          <button onclick=\"{{ upload.onApply }}\" style=\"{{ accentBtnStyle }}\">Apply to {{ dayLong }}<\u002Fbutton>\n          <button onclick=\"{{ upload.onCancel }}\" style=\"{{ ghostBtnStyle }}\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"color:#ff9425;font-size:13px;font-weight:700;margin-top:12px;\">Day shift only ({{ upload.dayWindowLabel }}) · {{ upload.timeExcludedCount }} row(s) outside day shift excluded.<\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-top:4px;\">Applying replaces {{ dayLong }}'s contributions and achieved numbers only — other days' uploads are kept.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ================= CONTRIBUTIONS ================= -->\n  <sc-if value=\"{{ isContrib }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-if value=\"{{ contrib.has }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;margin-bottom:16px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"{{ barSm }}\"><\u002Fdiv>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em;\">Individual Contributions — {{ dayLong }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <button onclick=\"{{ onGoUpload }}\" style=\"{{ accentBtnStyle }}\">⬆ Upload / replace file<\u002Fbutton>\n            <button onclick=\"{{ contrib.onClear }}\" style=\"background:#2a1618;color:#ff8079;border:1px solid #4a2327;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Barlow',sans-serif;\">Remove import<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">From <strong style=\"color:#cdd5df;\">{{ contrib.fileName }}<\u002Fstrong> · {{ contrib.metricLabel }}<\u002Fdiv>\n        <div style=\"{{ contrib.headStyle }}\">\n          <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;\">#<\u002Fdiv>\n          <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Builder<\u002Fdiv>\n          <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;\">By category<\u002Fdiv>\n          <div style=\"text-align:right;color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;\">Total<\u002Fdiv>\n          <sc-if value=\"{{ contrib.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:right;color:#4aa8ff;font-size:12px;font-weight:700;text-transform:uppercase;\">Media<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-for list=\"{{ contrib.people }}\" as=\"p\" hint-placeholder-count=\"10\">\n          <div style=\"{{ p.rowStyle }}\" onclick=\"{{ p.onToggle }}\">\n            <div style=\"color:#7f8a99;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;\">{{ p.rank }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;min-width:0;\">\n              <span style=\"font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ p.name }}<\u002Fspan>\n              <sc-if value=\"{{ p.partner }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"flex-shrink:0;display:inline-block;padding:3px 9px;border-radius:6px;background:#2c2447;color:#d9c6ff;border:1px solid #b98cff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Partner<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"flex-shrink:0;color:#5b6472;font-size:12px;\">{{ p.expandLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color:#9aa4b2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ p.detail }}<\u002Fdiv>\n            <div style=\"text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#34d17a;font-variant-numeric:tabular-nums;\">{{ p.total }}<\u002Fdiv>\n            <sc-if value=\"{{ contrib.hasMedia }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#4aa8ff;font-variant-numeric:tabular-nums;\">{{ p.media }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ p.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"grid-column:1 / -1;background:#141821;border:1px solid #262d38;border-radius:10px;padding:14px 16px;margin:-2px 0 10px;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n                <span style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Time in Path — this week<\u002Fspan>\n                <span style=\"color:#cdd5df;font-size:14px;font-weight:700;\">{{ p.tip.totalHours }} hrs total<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.tip.hasRows }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ p.tip.rows }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;gap:12px;\">\n                      <span style=\"{{ t.chip }}\">{{ t.path }}<\u002Fspan>\n                      <div style=\"flex:1;height:10px;background:#20262f;border-radius:5px;overflow:hidden;\"><div style=\"{{ t.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                      <span style=\"color:#cdd5df;font-size:13px;font-weight:700;width:80px;text-align:right;\">{{ t.hours }} hrs<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.tip.noRows }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"color:#7f8a99;font-size:13px;\">Not assigned to a path this week yet.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ contrib.hasUnmatched }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#211a10;border:1px solid #4a3717;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <div style=\"width:8px;height:23px;background:#ff9425;border-radius:2px;\"><\u002Fdiv>\n              <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;color:#ffb066;\">Unassigned aliases<\u002Fspan>\n            <\u002Fdiv>\n            <button onclick=\"{{ contrib.onToggleUnassigned }}\" style=\"background:transparent;border:1px solid #4a3717;border-radius:8px;color:#ffb066;font-size:12px;font-weight:700;cursor:pointer;padding:6px 10px;\">{{ contrib.unassignedToggleLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ contrib.showUnassigned }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#c8a878;font-size:13px;margin-bottom:14px;\">These aliases from the file aren't tied to anyone. Pick a builder to attach the alias — it saves to their profile and applies to every import. For Sort and Receive, only builders scheduled to that path today are offered.<\u002Fdiv>\n            <sc-for list=\"{{ contrib.unmatchedRows }}\" as=\"u\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:1fr 84px 1fr 90px 220px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #3a2f1c;\">\n                <span style=\"font-family:'Barlow',monospace;font-weight:700;font-size:15px;color:#ffcf9a;\">{{ u.alias }}<\u002Fspan>\n                <span style=\"{{ u.pathChipStyle }}\">{{ u.path }}<\u002Fspan>\n                <span style=\"color:#9aa4b2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ u.detail }}<\u002Fspan>\n                <span style=\"font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-align:center;\">{{ u.total }}<\u002Fspan>\n                {{ u.sel }}\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ contribEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:48px 30px;text-align:center;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;color:#9aa4b2;\">No contributions imported for {{ dayLong }}<\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:15px;margin-top:8px;margin-bottom:20px;\">Upload that day's spreadsheet to see per-person numbers here.<\u002Fdiv>\n        <button onclick=\"{{ onGoUpload }}\" style=\"{{ accentBtnStyle }}\">⬆ Upload achieved data ({{ dayLong }})<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Quarterly report: no separate tab — lives here, at the bottom of Contributions,\n         for any workspace with Sort/Receive workflows. -->\n    <sc-if value=\"{{ supportsQuarterly }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:28px;padding-top:20px;border-top:1px solid #2c333f;\">\n    <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;margin-bottom:4px;\">Quarterly report<\u002Fdiv>\n    <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">Upload one file per quarter. Uploading a new file replaces whatever was here before — there's no need to clear it first.<\u002Fdiv>\n    <label style=\"display:block;cursor:pointer;\" ondrop=\"{{ quarterly.onDrop }}\" ondragover=\"{{ quarterly.onDragOver }}\">\n      <input type=\"file\" accept=\".xlsx,.csv\" onchange=\"{{ quarterly.onFileInput }}\" style=\"display:none;\">\n      <div style=\"border:2px dashed #3a4553;border-radius:16px;background:#161b22;padding:40px 30px;text-align:center;transition:border-color .15s;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.03em;color:#eef2f7;\">Drop this quarter's Excel or CSV here<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:15px;margin-top:8px;\">Drag a <strong style=\"color:#cdd5df;\">.xlsx<\u002Fstrong> or <strong style=\"color:#cdd5df;\">.csv<\u002Fstrong> file onto this box, or click to browse.<\u002Fdiv>\n        <div style=\"display:inline-block;margin-top:16px;background:#212630;border:1px solid #2c333f;border-radius:10px;padding:10px 20px;color:#cdd5df;font-weight:700;font-size:14px;\">Choose file…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Flabel>\n\n    <sc-if value=\"{{ quarterly.error }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;background:#2a1618;border:1px solid #4a2327;border-radius:12px;padding:16px 20px;color:#ff8079;font-weight:600;\">{{ quarterly.error }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ quarterly.has }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:16px 20px;\">\n        <div>\n          <div style=\"font-weight:700;font-size:15px;\">{{ quarterly.fileName }}<\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:12px;margin-top:2px;\">{{ quarterly.totalRows }} rows · {{ quarterly.recoveryRowCount }} Receive/Recovery · {{ quarterly.sortRowCount }} Sort · imported {{ quarterly.uploadedLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ quarterly.onClear }}\" style=\"background:#2a1618;color:#ff8079;border:1px solid #4a2327;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;\">Remove file<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ quarterly.hasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;background:#211a10;border:1px solid #4a3717;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <div style=\"width:8px;height:23px;background:#ff9425;border-radius:2px;\"><\u002Fdiv>\n              <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;color:#ffb066;\">Data quality<\u002Fspan>\n            <\u002Fdiv>\n            <button onclick=\"{{ quarterly.onToggleAlerts }}\" style=\"background:transparent;border:1px solid #4a3717;border-radius:8px;color:#ffb066;font-size:12px;font-weight:700;cursor:pointer;padding:6px 10px;\">{{ quarterly.alertsToggleLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ quarterly.alertsExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n            <ul style=\"margin:10px 0 0 20px;padding:0;color:#c8a878;font-size:13px;line-height:1.7;\">\n              <sc-for list=\"{{ quarterly.alerts }}\" as=\"al\" hint-placeholder-count=\"3\">\n                <li>{{ al.text }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;\">\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:4px;\">Part type breakdown<\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">DRAM excluded, grouped into the same categories leadership tracks.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 60px 60px 1fr;gap:10px;padding-bottom:8px;border-bottom:2px solid #2c333f;margin-bottom:4px;\">\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Category<\u002Fdiv>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-align:right;\">Count<\u002Fdiv>\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-align:right;\">%<\u002Fdiv>\n            <div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ quarterly.categoryRows }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:1fr 60px 60px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #20262f;\">\n              <span style=\"font-size:13px;font-weight:600;\">{{ c.category }}<\u002Fspan>\n              <span style=\"font-size:13px;text-align:right;font-variant-numeric:tabular-nums;\">{{ c.count }}<\u002Fspan>\n              <span style=\"font-size:13px;text-align:right;color:#9aa4b2;\">{{ c.pct }}%<\u002Fspan>\n              <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:10px;\"><div style=\"{{ c.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:4px;\">Disposition mix — Sort<\u002Fdiv>\n            <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">Where selected parts were sent (non-DRAM).<\u002Fdiv>\n            <sc-if value=\"{{ quarterly.hasDispositionData }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:1fr 60px 60px 1fr;gap:10px;padding-bottom:8px;border-bottom:2px solid #2c333f;margin-bottom:4px;\">\n                <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Disposition<\u002Fdiv>\n                <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-align:right;\">Count<\u002Fdiv>\n                <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-align:right;\">%<\u002Fdiv>\n                <div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ quarterly.dispositionRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:1fr 60px 60px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #20262f;\">\n                  <span style=\"font-size:13px;font-weight:600;\">{{ p.disposition }}<\u002Fspan>\n                  <span style=\"font-size:13px;text-align:right;font-variant-numeric:tabular-nums;\">{{ p.count }}<\u002Fspan>\n                  <span style=\"font-size:13px;text-align:right;color:#9aa4b2;\">{{ p.pct }}%<\u002Fspan>\n                  <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:10px;\"><div style=\"{{ p.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !quarterly.hasDispositionData }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"color:#7f8a99;font-size:13px;\">No disposition data in this file.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:4px;\">Parts by period<\u002Fdiv>\n            <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">Broken down across the 3 work periods of the day.<\u002Fdiv>\n            <sc-if value=\"{{ quarterly.hasPeriodData }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:6px;\">Days<\u002Fdiv>\n              <sc-for list=\"{{ quarterly.dayPeriodRows }}\" as=\"pr\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:10px;\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;\">\n                    <span style=\"font-size:12px;font-weight:600;\">{{ pr.period }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#9aa4b2;\">{{ pr.count }} · {{ pr.pct }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:10px;\"><div style=\"{{ pr.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"color:#9aa4b2;font-size:12px;font-weight:700;text-transform:uppercase;margin:14px 0 6px;\">Nights<\u002Fdiv>\n              <sc-for list=\"{{ quarterly.nightPeriodRows }}\" as=\"pr\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:10px;\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;\">\n                    <span style=\"font-size:12px;font-weight:600;\">{{ pr.period }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#9aa4b2;\">{{ pr.count }} · {{ pr.pct }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:10px;\"><div style=\"{{ pr.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !quarterly.hasPeriodData }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"color:#7f8a99;font-size:13px;\">No rows fell inside a work period — check the Transaction/Last Touch Date columns.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ================= TRAINING AREA: ASSIGN ================= -->\n  <sc-if value=\"{{ isTrainingAssign }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"color:#7f8a99;font-size:13px;margin-bottom:16px;\">Every person in each department — not tied to any particular day.<\u002Fdiv>\n    <sc-for list=\"{{ trainingArea.wsSections }}\" as=\"ws\" hint-placeholder-count=\"3\">\n      <sc-if value=\"{{ ws.hasPeople }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:20px;\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px;\">{{ ws.label }}<\u002Fdiv>\n          <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:16px 18px;\">\n            <sc-for list=\"{{ ws.people }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"border-top:1px solid #20262f;padding-top:10px;margin-top:10px;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;\">\n                  <span style=\"font-weight:700;font-size:15px;color:#eef2f7;\">{{ p.name }}<\u002Fspan>\n                  <button onclick=\"{{ p.onAddSkill }}\" style=\"background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-size:12px;font-weight:700;cursor:pointer;padding:6px 12px;\">+ Add skill<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.hasTrainings }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <sc-for list=\"{{ p.trainings }}\" as=\"t\" hint-placeholder-count=\"2\">\n                      <div style=\"background:#161b22;border-radius:8px;padding:10px 12px;\">\n                        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;\">\n                          <div style=\"display:flex;align-items:center;gap:8px;\">\n                            <span style=\"display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:#2a1f38;color:#e0a8ff;\">{{ t.area }}<\u002Fspan>\n                            <span style=\"font-weight:600;font-size:13px;color:#cdd5df;\">{{ t.name }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <button onclick=\"{{ t.onRemove }}\" style=\"background:transparent;border:none;color:#ff8079;font-size:14px;font-weight:700;cursor:pointer;\">×<\u002Fbutton>\n                        <\u002Fdiv>\n                        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;\">\n                          <div>\n                            <div style=\"color:#7f8a99;font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:2px;\">OJT<\u002Fdiv>\n                            <input value=\"{{ t.ojt }}\" onchange=\"{{ t.onOjt }}\" style=\"width:100%;min-height:28px;background:#212630;border:1px solid #2c333f;border-radius:5px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:0 6px;\">\n                          <\u002Fdiv>\n                          <div>\n                            <div style=\"color:#7f8a99;font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:2px;\">EA<\u002Fdiv>\n                            <input value=\"{{ t.ea }}\" onchange=\"{{ t.onEa }}\" style=\"width:100%;min-height:28px;background:#212630;border:1px solid #2c333f;border-radius:5px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:0 6px;\">\n                          <\u002Fdiv>\n                          <div>\n                            <div style=\"color:#7f8a99;font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:2px;\">PA<\u002Fdiv>\n                            <input value=\"{{ t.pa }}\" onchange=\"{{ t.onPa }}\" style=\"width:100%;min-height:28px;background:#212630;border:1px solid #2c333f;border-radius:5px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;padding:0 6px;\">\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ !p.hasTrainings }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"color:#4a5261;font-size:12px;\">No skills recorded yet.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fsc-if>\n\n  <!-- ================= TRAINING AREA: SETUP (skill catalog) ================= -->\n  <sc-if value=\"{{ isTrainingSetup }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n      <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:4px;\">Skill catalog<\u002Fdiv>\n      <div style=\"color:#7f8a99;font-size:13px;margin-bottom:16px;\">Add the actual skills that exist in each area — these are what shows up when adding a skill to someone in Assign.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;\">\n        <sc-for list=\"{{ trainingArea.catalogByArea }}\" as=\"ca\" hint-placeholder-count=\"5\">\n          <div style=\"background:#161b22;border:1px solid #2c333f;border-radius:10px;padding:14px;\">\n            <div style=\"font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:#e0a8ff;margin-bottom:10px;\">{{ ca.area }}<\u002Fdiv>\n            <sc-for list=\"{{ ca.skills }}\" as=\"sk\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:6px;margin-bottom:6px;\">\n                <input value=\"{{ sk.name }}\" onchange=\"{{ sk.onName }}\" placeholder=\"Skill name\" style=\"flex:1;min-width:0;min-height:34px;background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;padding:0 8px;\">\n                <button onclick=\"{{ sk.onRemove }}\" style=\"min-height:34px;min-width:30px;background:#2a1618;border:1px solid #4a2327;border-radius:6px;color:#ff8079;font-size:14px;font-weight:700;cursor:pointer;\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button onclick=\"{{ ca.onAdd }}\" style=\"width:100%;margin-top:4px;background:transparent;border:1px dashed #3a4553;border-radius:6px;color:#9aa4b2;font-size:12px;font-weight:700;cursor:pointer;padding:8px;\">+ Add skill<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= FA SHIFT DASHBOARD ================= -->\n  <sc-if value=\"{{ isFaDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:10px;margin-bottom:16px;\" data-print-hide=\"1\">\n      <button onclick=\"{{ faDashboardData.onNight }}\" style=\"padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;background:{{ faDashboardData.nightActive ? '#ff9425' : '#191d24' }};color:{{ faDashboardData.nightActive ? '#161616' : '#eef2f7' }};border:1px solid #2c333f;\">Night Shift<\u002Fbutton>\n      <button onclick=\"{{ faDashboardData.onDay }}\" style=\"padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;background:{{ faDashboardData.dayActive ? '#ff9425' : '#191d24' }};color:{{ faDashboardData.dayActive ? '#161616' : '#eef2f7' }};border:1px solid #2c333f;\">Day Shift<\u002Fbutton>\n    <\u002Fdiv>\n\n    <label style=\"display:block;cursor:pointer;\" ondrop=\"{{ faDashboardData.onDrop }}\" ondragover=\"{{ faDashboardData.onDragOver }}\">\n      <input type=\"file\" accept=\".xlsx,.csv\" onchange=\"{{ faDashboardData.onFileInput }}\" style=\"display:none;\">\n      <div style=\"border:2px dashed #3a4553;border-radius:16px;background:#161b22;padding:36px 30px;text-align:center;transition:border-color .15s;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:#eef2f7;\">Drop the shift CSV here<\u002Fdiv>\n        <div style=\"color:#9aa4b2;font-size:14px;margin-top:8px;\">Drag a <strong style=\"color:#cdd5df;\">.csv<\u002Fstrong> file onto this box, or click to browse. Uploading a new file replaces the previous one.<\u002Fdiv>\n        <div style=\"display:inline-block;margin-top:14px;background:#212630;border:1px solid #2c333f;border-radius:10px;padding:10px 20px;color:#cdd5df;font-weight:700;font-size:14px;\">Choose file…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Flabel>\n\n    <sc-if value=\"{{ faDashboardData.error }}\" hint-placeholder-val=\"{{ false }}\">\n rsor:pointer;\">Remove file<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ faDashboardData.binScan.hasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n          <ul style=\"margin:10px 0 0 20px;padding:0;color:#c8a878;font-size:12px;line-height:1.6;\">\n            <sc-for list=\"{{ faDashboardData.binScan.alerts }}\" as=\"al\" hint-placeholder-count=\"2\">\n              <li>{{ al.text }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ faDashboardData.binScan.hasData }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#7f8a99;font-size:11px;margin-top:10px;\">{{ faDashboardData.binScan.windowLabel }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px;\">\n            <div style=\"background:#12151a;border-radius:8px;padding:10px;text-align:center;\">\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;\">{{ faDashboardData.binScan.uniqueSerialCount }}<\u002Fdiv>\n              <div style=\"color:#9aa4b2;font-size:10px;font-weight:700;text-transform:uppercase;\">Parts<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#12151a;border-radius:8px;padding:10px;text-align:center;\">\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;\">{{ faDashboardData.binScan.uniqueBinCount }}<\u002Fdiv>\n              <div style=\"color:#9aa4b2;font-size:10px;font-weight:700;text-transform:uppercase;\">Bins<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#12151a;border-radius:8px;padding:10px;text-align:center;\">\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;\">{{ faDashboardData.binScan.uniquePartTypeCount }}<\u002Fdiv>\n              <div style=\"color:#9aa4b2;font-size:10px;font-weight:700;text-transform:uppercase;\">Part Types<             <ul style=\"margin:0 0 0 20px;padding:0;color:#cdd5df;font-size:13px;line-height:1.8;\">\n              <sc-for list=\"{{ faDashboardData.insights }}\" as=\"ins\" hint-placeholder-count=\"3\">\n                <li>{{ ins.text }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;margin-top:16px;\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:14px;\">Part-type breakdown<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 70px 70px 70px 70px 80px 70px;gap:8px;padding-bottom:8px;border-bottom:2px solid #2c333f;margin-bottom:4px;\">\n            <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Part Type<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Pass<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Fail<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Retest<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Tested<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Fail %<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;\">Packed<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ faDashboardData.partTypeRows }}\" as=\"pt\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:1fr 70px 70px 70px 70px 80px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;\">\n              <span style=\"font-size:13px;font-weight:600;\">{{ pt.partType }}<\u002Fspan>\n
