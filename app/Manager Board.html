ncData }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"color:#7f8a99;font-size:13px;\">No CNC activity found.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;margin-top:16px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;\">\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;\">🎯 Shift goal tracker<\u002Fdiv>\n            <button onclick=\"{{ faDashboardData.onClearGoals }}\" style=\"background:#2a1618;color:#ff8079;border:1px solid #4a2327;border-radius:8px;padding:8px 14px;font-weight:600;font-size:12px;cursor:pointer;\">✕ Clear goals<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:12px;margin-bottom:14px;\">Set shift goals for each component (tested &amp; packed). Goals are saved automatically.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 80px 70px 70px 90px repeat(1,90px) 80px 70px 70px 90px;gap:6px;padding-bottom:6px;border-bottom:2px solid #2c333f;margin-bottom:4px;\">\n            <div style=\"color:#9aa4b2;font-size:10px;font-weight:700;text-transform:uppercase;\">Component<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Test Goal<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Actual<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Remain<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Status<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Pack Goal<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Actual<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Remain<\u002Fdiv>\n            <div style=\"text-align:center;color:#9aa4b2;font-size:10px;font-weight:700;\">Status<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ faDashboardData.goalRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:1fr 80px 70px 70px 90px 90px 80px 70px 70px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;\">\n              <span style=\"font-size:13px;font-weight:700;\">{{ g.component }}<\u002Fspan>\n              <input value=\"{{ g.testedGoal }}\" onchange=\"{{ g.onTestedGoal }}\" type=\"number\" min=\"0\" placeholder=\"0\" style=\"width:100%;min-height:32px;background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-size:12px;text-align:center;\">\n              <span style=\"text-align:center;font-size:13px;\">{{ g.testedActual }}<\u002Fspan>\n              <span style=\"text-align:center;font-size:12px;color:#9aa4b2;\">{{ g.testedRemain }}<\u002Fspan>\n              <div style=\"text-align:center;\"><span style=\"{{ g.testedStatusStyle }}\">{{ g.testedPct }}%<\u002Fspan><\u002Fdiv>\n              <input value=\"{{ g.packedGoal }}\" onchange=\"{{ g.onPackedGoal }}\" type=\"number\" min=\"0\" placeholder=\"0\" style=\"width:100%;min-height:32px;background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-size:12px;text-align:center;\">\n              <span style=\"text-align:center;font-size:13px;\">{{ g.packedActual }}<\u002Fspan>\n              <span style=\"text-align:center;font-size:12px;color:#9aa4b2;\">{{ g.packedRemain }}<\u002Fspan>\n              <div style=\"text-align:center;\"><span style=\"{{ g.packedStatusStyle }}\">{{ g.packedPct }}%<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:grid;grid-template-columns:1fr 80px 70px 70px 90px 90px 80px 70px 70px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;\">\n            <span style=\"font-size:13px;font-weight:700;\">DRAM (scan)<\u002Fspan>\n            <input value=\"{{ faDashboardData.dramScanGoal }}\" onchange=\"{{ faDashboardData.onDramScanGoal }}\" type=\"number\" min=\"0\" placeholder=\"0\" style=\"width:100%;min-height:32px;background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-size:12px;text-align:center;\">\n            <span style=\"text-align:center;font-size:13px;\">{{ faDashboardData.dramScanActual }}<\u002Fspan>\n            <span style=\"text-align:center;font-size:12px;color:#9aa4b2;\">{{ faDashboardData.dramRemain }}<\u002Fspan>\n            <div style=\"text-align:center;\"><span style=\"{{ faDashboardData.dramStatusStyle }}\">—<\u002Fspan><\u002Fdiv>\n            <div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 80px 70px 70px 90px 90px 80px 70px 70px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;\">\n            <span style=\"font-size:13px;font-weight:700;\">Metal Removal<\u002Fspan>\n            <input value=\"{{ faDashboardData.metalRemovalGoal }}\" onchange=\"{{ faDashboardData.onMetalRemovalGoal }}\" type=\"number\" min=\"0\" placeholder=\"0\" style=\"width:100%;min-height:32px;background:#212630;border:1px solid #2c333f;border-radius:6px;color:#eef2f7;font-size:12px;text-align:center;\">\n            <span style=\"text-align:center;font-size:13px;\">{{ faDashboardData.metalRemovalActual }}<\u002Fspan>\n            <span style=\"text-align:center;font-size:12px;color:#9aa4b2;\">{{ faDashboardData.metalRemovalRemain }}<\u002Fspan>\n            <div style=\"text-align:center;\"><span style=\"{{ faDashboardData.metalRemovalStatusStyle }}\">—<\u002Fspan><\u002Fdiv>\n            <div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:24px;margin-top:16px;padding-top:14px;border-top:1px solid #2c333f;\">\n            <div><div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Overall Tested<\u002Fdiv><div style=\"font-weight:700;font-size:16px;margin-top:2px;\">{{ faDashboardData.goalOverallTestedLabel }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Overall Packed<\u002Fdiv><div style=\"font-weight:700;font-size:16px;margin-top:2px;\">{{ faDashboardData.goalOverallPackedLabel }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;\">Avg Completion<\u002Fdiv><div style=\"font-weight:700;font-size:16px;margin-top:2px;\">{{ faDashboardData.goalAvgCompletionLabel }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;margin-top:16px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;\">\n            <input value=\"{{ faDashboardData.employeeSearch }}\" onchange=\"{{ faDashboardData.onEmployeeSearch }}\" placeholder=\"Search builder name…\" style=\"min-width:220px;min-height:38px;background:#161b22;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:13px;padding:0 12px;\">\n            <div style=\"display:flex;gap:8px;\">\n              <button onclick=\"{{ faDashboardData.onSelectAllUsers }}\" style=\"background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-size:12px;font-weight:700;cursor:pointer;padding:8px 14px;\">Select All<\u002Fbutton>\n              <button onclick=\"{{ faDashboardData.onClearAllUsers }}\" style=\"background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-size:12px;font-weight:700;cursor:pointer;padding:8px 14px;\">Clear All<\u002Fbutton>\n              <button onclick=\"{{ faDashboardData.onExport }}\" style=\"background:#12271b;border:1px solid #1f4a30;border-radius:8px;color:#34d17a;font-size:12px;font-weight:700;cursor:pointer;padding:8px 14px;\">⬇ Export Selected<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ faDashboardData.hasUserChecks }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <sc-for list=\"{{ faDashboardData.userChecks }}\" as=\"u\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:10px;background:#161b22;border:1px solid #2c333f;border-radius:8px;padding:8px 12px;\">\n                  <input type=\"checkbox\" checked=\"{{ u.checked }}\" onchange=\"{{ u.onToggle }}\" style=\"width:15px;height:15px;accent-color:#ff9425;cursor:pointer;flex-shrink:0;\">\n                  <span style=\"font-size:13px;font-weight:600;min-width:140px;\">{{ u.user }}<\u002Fspan>\n                  <sc-if value=\"{{ u.matched }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"display:inline-flex;align-items:center;gap:5px;color:#34d17a;font-size:12px;font-weight:600;\">✓ Linked to {{ u.matchedName }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ !u.matched }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"color:#ffb066;font-size:12px;font-weight:600;\">Not in FA roster —<\u002Fspan>\n                    <div style=\"max-width:260px;\">{{ u.assignSelectEl }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !faDashboardData.hasUserChecks }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"color:#7f8a99;font-size:13px;\">No builders match the current search.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ faDashboardData.hasEmployees }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:14px;\">\n            <sc-for list=\"{{ faDashboardData.employees }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;margin-bottom:10px;\">\n                  <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;\">{{ e.user }}<\u002Fspan>\n                  <div style=\"display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#9aa4b2;\">\n                    <span>Tested: <strong style=\"color:#eef2f7;\">{{ e.tested }}<\u002Fstrong><\u002Fspan>\n                    <span>Packed: <strong style=\"color:#eef2f7;\">{{ e.packed }}<\u002Fstrong><\u002Fspan>\n                    <span>Sanitized: <strong style=\"color:#eef2f7;\">{{ e.sanitized }}<\u002Fstrong><\u002Fspan>\n                    <span>CNC: <strong style=\"color:#eef2f7;\">{{ e.cnc }}<\u002Fstrong><\u002Fspan>\n                    <span>P/F/R: <strong style=\"color:#eef2f7;\">{{ e.pass }}/{{ e.fail }}/{{ e.retest }}<\u002Fstrong><\u002Fspan>\n                    <span>Rate: <strong style=\"color:#eef2f7;\">{{ e.rate }}<\u002Fstrong>/hr<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;\">\n                  <sc-for list=\"{{ e.parts }}\" as=\"pp\" hint-placeholder-count=\"3\">\n                    <span style=\"display:inline-block;background:#161b22;border:1px solid #2c333f;border-radius:6px;padding:5px 10px;font-size:11px;color:#cdd5df;\">{{ pp.text }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"background:#161b22;border-radius:5px;overflow:hidden;height:8px;margin-bottom:8px;\"><div style=\"{{ e.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"color:#7f8a99;font-size:12px;\">Pass Rate: {{ e.passPctLabel }} | Fail Rate: {{ e.failPctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ================= SETUP ================= -->\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <sc-if value=\"{{ isMediaReuse }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;\">\n            <div style=\"{{ barSm }}\"><\u002Fdiv>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;\">Roster ({{ builderCount }})<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:13px;margin-bottom:14px;\">Media Reuse always uses Speed's roster — add, rename, or remove people from <strong style=\"color:#cdd5df;\">Speed<\u002Fstrong>'s Setup tab and it shows up here automatically.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <sc-for list=\"{{ setupBuilders }}\" as=\"b\" hint-placeholder-count=\"12\">\n              <span style=\"display:inline-block;padding:6px 12px;border-radius:8px;background:#212630;border:1px solid #2c333f;color:#eef2f7;font-size:13px;font-weight:600;\">{{ b.name }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !isMediaReuse }}\" hint-placeholder-val=\"{{ true }}\">\n      <div onfocus=\"{{ onRosterFocus }}\" onblur=\"{{ onRosterBlur }}\" style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"{{ barSm }}\"><\u002Fdiv>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;\">{{ wsLabel }} Roster ({{ builderCount }})<\u002Fspan>\n          <\u002Fdiv>\n          <button onclick=\"{{ onAddBuilder }}\" style=\"{{ accentBtnStyle }}\">+ Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:13px;margin-bottom:12px;\">Add or edit names here — rotation, head count and attendance update automatically. <strong style=\"color:#cdd5df;\">Alias<\u002Fstrong> ties a builder to their login in imported spreadsheets — for Sort (\"Last Touch By\") imports, that's just their <strong style=\"color:#cdd5df;\">Name<\u002Fstrong>, since that column already is the person's name. Tick <strong style=\"color:#cdd5df;\">Partner<\u002Fstrong> to flag them as a partner.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:28px 1.4fr 130px 1fr 90px 38px;gap:10px;align-items:center;padding-bottom:6px;border-bottom:2px solid #2c333f;margin-bottom:4px;\">\n          <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;\">#<\u002Fdiv>\n          <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Builder<\u002Fdiv>\n          <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Role<\u002Fdiv>\n          <div style=\"color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Alias (import)<\u002Fdiv>\n          <div style=\"text-align:center;color:#9aa4b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;\">Partner<\u002Fdiv>\n          <div><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ setupBuilders }}\" as=\"b\" hint-placeholder-count=\"12\">\n          <div style=\"display:grid;grid-template-columns:28px 1.4fr 130px 1fr 90px 38px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #20262f;\">\n            <div style=\"color:#7f8a99;font-weight:600;font-variant-numeric:tabular-nums;\">{{ b.idx }}<\u002Fdiv>\n            <input value=\"{{ b.name }}\" onchange=\"{{ b.onName }}\" placeholder=\"Builder name\" style=\"width:100%;min-height:42px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;padding:0 12px;\">\n            {{ b.roleEl }}\n            <input value=\"{{ b.alias }}\" onchange=\"{{ b.onAlias }}\" placeholder=\"alias / login (comma for more)\" style=\"width:100%;min-height:42px;background:#161b22;border:1px solid #2c333f;border-radius:8px;color:#ffcf9a;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;padding:0 12px;\">\n            <label style=\"display:flex;align-items:center;justify-content:center;min-height:42px;cursor:pointer;\">\n              <input type=\"checkbox\" checked=\"{{ b.partner }}\" onchange=\"{{ b.onPartner }}\" style=\"width:20px;height:20px;accent-color:#b98cff;cursor:pointer;\">\n            <\u002Flabel>\n            <button onclick=\"{{ b.onRemove }}\" style=\"min-height:42px;background:#2a1618;border:1px solid #4a2327;border-radius:8px;color:#ff8079;font-size:18px;font-weight:700;cursor:pointer;\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14p { barSm }}\"><\u002Fdiv>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;\">Goal Categories<\u002Fspan>\n          <\u002Fdiv>\n          <button onclick=\"{{ onAddGoalCat }}\" style=\"{{ accentBtnStyle }}\">+ Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"color:#7f8a99;font-size:12px;margin-bottom:10px;\">The rows shown on the {{ wsLabel }} Goals page (and in Overall). Independent of paths.<\u002Fdiv>\n        <sc-for list=\"{{ setupGoalCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #20262f;\">\n            <input value=\"{{ c.value }}\" onchange=\"{{ c.onChange }}\" style=\"width:100%;min-height:42px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;padding:0 12px;\">\n            <button onclick=\"{{ c.onRemove }}\" style=\"min-height:42px;background:#2a1618;border:1px solid #4a2327;border-radius:8px;color:#ff8079;font-size:18px;font-weight:700;cursor:pointer;\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isSpeedWorkspace }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <div style=\"{{ barSm }}\"><\u002Fdiv>\n              <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;\">Media Reuse Goal Categories<\u002Fspan>\n            <\u002Fdiv>\n            <button onclick=\"{{ onAddMediaReuseGoalCat }}\" style=\"{{ accentBtnStyle }}\">+ Add<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:12px;margin-bottom:10px;\">The rows shown on Speed's <strong style=\"color:#cdd5df;\">Media Reuse<\u002Fstrong> tab. Separate from Speed's own categories above — same people, different goals.<\u002Fdiv>\n          <sc-for list=\"{{ mediaReuseGoalCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #20262f;\">\n              <input value=\"{{ c.value }}\" onchange=\"{{ c.onChange }}\" style=\"width:100%;min-height:42px;background:#212630;border:1px solid #2c333f;border-radius:8px;color:#eef2f7;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;padding:0 12px;\">\n              <button onclick=\"{{ c.onRemove }}\" style=\"min-height:42px;background:#2a1618;border:1px solid #4a2327;border-radius:8px;color:#ff8079;font-size:18px;font-weight:700;cursor:pointer;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFaWorkspace }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:20px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;\">\n            <div style=\"{{ barSm }}\"><\u002Fdiv>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;\">Tester Options<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"color:#7f8a99;font-size:12px;margin-bottom:14px;\">Who or what shows up in the tester picker on the Board for these stations. PSU Test's names are still placeholders — rename them here.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;\">\n            <sc-for list=\"{{ machineOptionGroups }}\" as=\"mg\" hint-placeholder-count=\"4 if value=\"{{ isOverall }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:2px solid #2c333f;margin-bottom:18px;\" data-print-hide=\"1\">\n      <div style=\"display:flex;gap:6px;\">\n        <sc-for list=\"{{ overallSubTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;padding-bottom:8px;\">\n        <button onclick=\"{{ onExportCSV }}\" style=\"{{ accentBtnStyle }}\">⬇ Export dashboard CSV<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isOverallDay }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;max-width:900px;\">\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n        <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Total Goal · All Programs<\u002Fdiv>\n        <div style=\"{{ kpiAccentStyle }}\">{{ overallTotal.goal }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n        <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Total Achieved<\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;margin-top:6px;\">{{ overallTotal.achieved }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#191d24;border:1px solid #2c333f;border-radius:14px;padding:18px 20px;\">\n        <div style=\"color:#9aa4b2;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;\">Attainment<\u002Fdiv>\n        <div style=\"{{ overallAttai \n  }\n  dayStyle(active, A){\n    const base = { flex:'1', padding:'15px 0', fontFamily:\"'Barlow Condensed',sans-serif\", fontWeight:700, fontSize:'22px', borderRadius:'10px', cursor:'pointer', letterSpacing:'.05em' };\n    return active ? { ...base, color:'#0f1216', background:A, border:'2px solid '+A } : { ...base, color:'#eef2f7', background:'#212630', border:'2px solid #2c333f' };\n  }\n  pctStyle(pct){\n    const col = pct>=100 ? '#34d17a' : (pct>=70 ? '#ff9425' : '#ff5a52');\n    return { color:col, fontSize:'14px', fontWeight:700, width:'46px', textAlign:'right', fontVariantNumeric:'tabular-nums' };\n  }\n\n  // ---------- mutations ----------\n  addBuilder(){ const k=this.state.workspace; this.update(d=>{ d.workspaces[k].builders.push({ id:k+'_b'+Date.now()+Math.floor(Math.random()*1000), name:'', role:'Builder', alias:'', partner:false }); }); }\n  removeBuilder(id){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; ws.builders = ws.builders.filter(b=>b.id!==id); this.DAYS.forEach(day=> this.Q.forEach(q=>{ delete ws.rotation[day][q][id]; })); }); }\n  renameBuilder(id, name){ const k=this.state.workspace; this.update(d=>{ const b = d.workspaces[k].builders.find(x=>x.id===id); if (b) b.name = name; }); }\n  setRole(id, role){ const k=this.state.workspace; this.update(d=>{ const b = d.workspaces[k].builders.find(x=>x.id===id); if (b) b.role = role; }); }\n  setAlias(id, v){ const k=this.state.workspace; this.update(d=>{ const b = d.workspaces[k].builders.find(x=>x.id===id); if (b) b.alias = v; }); }\n  // Sort imports (Last Touch By) carry the person's name, not a login — so Sort rows\n  // match against the builder's Name. Every other pathway (Transaction By-style logins)\n  // matches against the general Alias field.\n  // A builder can have several aliases (comma-separated), e.g. a login for Receive\n  // and a different one on the FA shift file. Assigning a new one ADDS it — it never\n  // replaces the aliases they already have.\n  aliasList(b){ return String((b&&b.alias)||'').split(',').map(s=>s.trim()).filter(Boolean); }\n  hasAlias(b, a){ const t=this.norm(a); return this.aliasList(b).some(x=>this.norm(x)===t); }\n  addAlias(b, a){ a=String(a||'').trim(); if(!a || this.hasAlias(b,a)) return; b.alias = [...this.aliasList(b), a].join(', '); }\n  matchBuilder(builders, alias, path){\n    if (!alias) return null;\n    const target = this.norm(alias);\n    // Match by EITHER name or alias, regardless of path — a person can legitimately\n    // show up identified by either field depending on the export/pathway, and\n    // restricting non-Sort paths to alias-only meant a real match by name was\n    // silently missed.\n    return builders.find(b => (b.name && this.norm(b.name)===target) || this.hasAlias(b, alias)) || null;\n  }\n  // FA's Shift Dashboard names come straight from the CSV (Transaction By / Last\n  // Touch By / Created By) with no separate alias step, so match against either the\n  // builder's Name or Alias — whichever was used to link them.\n  matchFaBuilder(builders, rawName){\n    if (!rawName) return null;\n    const target = this.norm(rawName);\n    return builders.find(b=> (b.name && this.norm(b.name)===target) || (b.alias && this.aliasList(b).some(x=>this.norm(x)===target))) || null;\n  }\n  assignFaUser(rawName, builderId){ if(!builderId) return; this.update(d=>{ const b=d.workspaces.fa.builders.find(x=>x.id===builderId); if(!b) return; this.addAlias(b, rawName); }); }\n  openFaBuilderModal(rawName){ this.setState({ newBuilderModal: { path:'FA Employee', name:this.capitalizeName(rawName), alias:'', role:'Builder', partner:false } }); }\n  setPartner(id, v){ const k=this.state.workspace; this.update(d=>{ const b = d.workspaces[k].builders.find(x=>x.id===id); if (b) b.partner = !!v; }); }\n  // Free-text note per builder per day — e.g. \"Left at 2:30pm\" — shown next to their\n  // name on Attendance. Not tied to a status; just a quick, dated note.\n  setNote(day, id, v){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; if(!ws.notes) ws.notes={}; if(!ws.notes[day]) ws.notes[day]={}; ws.notes[day][id]=v; }); }\n  setPath(i, v){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; const old=ws.paths[i]; ws.paths[i] = v; if (Array.isArray(ws.noHcPaths)){ const j=ws.noHcPaths.indexOf(old); if(j>=0) ws.noHcPaths[j]=v; } }); }\n  addPath(){ const k=this.state.workspace; this.update(d=>{ d.workspaces[k].paths.push(''); }); }\n  removePath(i){ const k=this.state.workspace; this.update(d=>{ d.workspaces[k].paths.splice(i,1); }); }\n  setGoalCat(i, v){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; if(!ws.goalCats) ws.goalCats=[]; const old=ws.goalCats[i]; ws.goalCats[i]=v; if(old && old!==v){ this.DAYS.forEach(day=>{ if(ws.goals[day] && ws.goals[day][old]!=null){ ws.goals[day][v]=ws.goals[day][old]; delete ws.goals[day][old]; } }); } }); }\n  addGoalCat(){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; if(!ws.goalCats) ws.goalCats=[]; ws.goalCats.push(''); }); }\n  removeGoalCat(i){ const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; const old=ws.goalCats[i]; ws.goalCats.splice(i,1); if(old){ this.DAYS.forEach(day=>{ if(ws.goals[day]) delete ws.goals[day][old]; }); } }); }\n  setStatus(i, v){ this.update(d=>{ d.statuses[i] = v; }); }\n  addStatus(){ this.update(d=>{ d.statuses.push(''); }); }\n  removeStatus(i){ this.update(d=>{ d.statuses.splice(i,1); }); }\n  setCell(day, q, id, v){ const k=this.state.workspace; this.update(d=>{ d.workspaces[k].rotation[day][q][id] = v; }); }\n  // Attendance: a pick fills the rest of the day. Later quarters follow along only if\n  // they were blank or still matched the old value, so a deliberate change (e.g. Q3 =\n  // Left Early) is never overwritten by re-picking Q1.\n  setCellCascade(day, q, id, v){ const k=this.state.workspace; this.update(d=>{ const r=d.workspaces[k].rotation[day]; const qi=this.Q.indexOf(q); const old=r[q][id]||''; r[q][id]=v;\n    this.Q.slice(qi+1).forEach(q2=>{ const cur=r[q2][id]||''; if(!cur || cur===old) r[q2][id]=v; }); }); }\n  // Paths flagged here (Lead, Training by default) are still assignable and shown\n  // everywhere, but people on them are left out of head count.\n  toggleNoHcPath(p){ if(!p) return; const k=this.state.workspace; this.update(d=>{ const ws=d.workspaces[k]; if(!Array.isArray(ws.noHcPaths)) ws.noHcPaths=[]; const i=ws.noHcPaths.indexOf(p); if(i>=0) ws.noHcPaths.splice(i,1); else ws.noHcPaths.push(p); }); }\n  // Start a day from the day before: paths carry over as-is, multi-day absences\n  // (PTO / OOTO / LOA) carry over, and one-off statuses (Late, Left Early, Call\n  // Out, Other…) turn back into that person's path for the day, or blank. Partner\n  // flags and FA tester picks come along too; notes don't.\n  CARRY_STATUSES = ['PTO','OOTO','Vacation','LOA','Present'];\n  copyFromPrevDay(day){ const i=this.DAYS.indexOf(day); if(i<=0) return; const prev=this.DAYS[i-1]; const k=this.state.workspace;\n    const ws0=this.state.data.workspaces[k]; if(!ws0) return;\n    const has = ws0.builders.some(b=> this.Q.some(q=> (ws0.rotation[day][q]||{})[b.id]));\n    if (has && !confirm('Replace '+this.DAYLONG[day]+'\\u2019s assignments with '+this.DAYLONG[prev]+'\\u2019s? Notes are kept.')) return;\n    this.update(d=>{ const ws=d.workspaces[k]; const src=ws.rotation[prev]; const dst=ws.rotation[day];\n      ws.builders.forEach(b=>{ const vals=this.Q.map(q=> (src[q]||{})[b.id]||''); const dayPath=vals.find(v=> ws.paths.indexOf(v)>=0)||'';\n        this.Q.forEach((q,qi)=>{ const v=vals[qi]; dst[q][b.id] = !v ? '' : (ws.paths.indexOf(v)>=0 || this.CARRY_STATUSES.indexOf(v)>=0) ? v : dayPath; }); });\n      if (ws.partnerDay) ws.partnerDay[day] = { ...(ws.partnerDay[prev]||{}) };\n      if (ws.machineAssign) ws.machineAssign[day] = { ...(ws.machineAssign[prev]||{}) }; }); }\n  setAll(day, id, v){ if(!v) return; const k=this.state.workspace; this.update(d=>{ this.Q.forEach(q=>{ d.workspaces[k].rotation[day][q][id] = v; }); }); }\n  togglePartnerDay(day, id){ const k=this.state.workspace; this.update(d=>{ const w=d.workspaces[k]; if(!w.partnerDay) w.partnerDay={}; if(!w.partnerDay[day]) w.partnerDay[day]={}; w.partnerDay[day][id] = !w.partnerDay[day][id]; }); }\n  toggleHideUnsetGoals(){ const v=!this.state.hideUnsetGoals; try { localStorage.setItem('rtHideUnsetGoals', v?'1':''); } catch(e){} this.setState({ hideUnsetGoals:v }); }\n  clearDayGoals(day){ const k=this.contribWsKey(); if(!confirm('Clear the Goals sheet for '+this.DAYLONG[day]+' (daily goals and achieved)?')) return;\n    this.update(d=>{ const ws=d.workspaces[k]; if(!ws.goals) ws.goals={}; ws.goals[day]={}; }); }\n  // Daily goals (targets) only — achieved numbers are that day's own.\n  copyGoalsFromPrevDay(day){ const i=this.DAYS.indexOf(day); if(i<=0) return; const prev=this.DAYS[i-1]; const k=this.contribWsKey();\n    const ws0=this.state.data.workspaces[k]; const cur=(ws0.goals&&ws0.goals[day])||{};\n    if (Object.keys(cur).some(c=>this.num(cur[c]&&cur[c].goal)>0) && !confirm('Replace '+this.DAYLONG[day]+'\\u2019s daily goals with '+this.DAYLONG[prev]+'\\u2019s? Achieved numbers are kept.')) return;\n    this.update(d=>{ const ws=d.workspaces[k]; if(!ws.goals) ws.goals={}; const src=ws.goals[prev]||{}; if(!ws.goals[day]) ws.goals[day]={}; const dst=ws.goals[day];\n      (ws.goalCats||[]).forEach(c=>{ if(!dst[c]) dst[c]={goal:0,a1:0,a2:0}; dst[c].goal=this.num(src[c]&&src[c].goal); }); }); }\n  setGoal(day, path, field, v){ const k=this.contribWsKey(); this.update(d=>{ const ws=d.workspaces[k]; if(!ws.goals[day]) ws.goals[day]={}; if(!ws.goals[day][path]) ws.goals[day][path]={goal:0,a1:0,a2:0}; ws.goals[day][path][field] = this.num(v); }); }\n  setWeekOf(v){ this.update(d=>{ d.weekOf = v; }); }\n  // Whole-tracker backup as one JSON file — moves data between computers/sites and\n  // guards against a browser's storage being wiped. Restore goes through save(),\n  // so on the cloud site it's pushed to everyone.\n  backupData(){ const d=this.state.data; const stamp=new Date().toISOString().slice(0,10);\n    const blob=new Blob([JSON.stringify({ app:'rotation-tracker', savedAt:new Date().toISOString(), data:d })], { type:'application/json' });\n    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='rotation-tracker-backup-'+stamp+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500); }\n  restoreData(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';\n    inp.onchange=()=>{ const f=inp.files && inp.files[0]; if(!f) return; f.text().then(t=>{\n      let j=null; try { j=JSON.parse(t); } catch(e){}\n      const data = j && j.data && j.data.workspaces ? j.data : (j && j.workspaces ? j : null);\n      if (!data){ alert('That file isn\\u2019t a Rotation Tracker backup.'); return; }\n      const when = j.savedAt ? new Date(j.savedAt).toLocaleString() : 'this file';\n      if (!confirm('Replace ALL tracker data (every area) with the backup from '+when+'?')) return;\n      const d=this.ensure(data); this.save(d); this.setState({ data:d }); alert('Backup restored.'); }); };\n    inp.click(); }\n  resetData(){ if (confirm('Reset ALL programs (Speed, FA, Super Market) to the sample data? This clears your saved changes.')){ const data = this.seedAll(); this.save(data); this.setState({ data }); } }\n  clearAll(){ const k=this.state.workspace; const lbl=this.WS_LABEL[k]; if (!confirm('Clear ALL '+lbl+' rotation assignments, imported contributions AND the Goals sheet (targets + achieved) for the whole week? Names, paths and statuses are kept.')) return; if (confirm('Export '+lbl+' to CSV before clearing?')) this.exportCSV(); this.update(d=>{ const ws=d.workspaces[k]; this.DAYS.forEach(day=> this.Q.forEach(q=>{ ws.builders.forEach(b=>{ ws.ro (nv)) { const m=cats.find(c=>/rma/i.test(c)); if(m) return m; }\n        return cats[0]||'';\n      };\n      const catMap={}; Object.keys(catSet).forEach(v=>{ catMap[v]=autoMap(v); });\n      this.setState({ imp:{ fileName:file.name, headers, body, colMap, metric, isSpeed,\n        combineWorkflowPartType,\n        filterVals, catValues:Object.keys(catSet), catCounts:catSet, catMap, cats,\n        showAliasCols:false, showColumnMapping:false, hideIgnoredCats:true, timeByCat, filterByTimeByCat,\n        // An upload replaces only the selected day's contributions; every other day's\n        // import is kept until a new file is uploaded for that day (or Clear week).\n        clearPrevious:false } });\n    }catch(e){ this.setState({ imp:{ error: (e && e.message) || 'Could not read this file.' } }); }\n  }\n  setImpCol(field, idx){ this.setState(s=>({ imp:{ ...s.imp, colMap:{ ...s.imp.colMap, [field]: parseInt(idx) } } })); }\n  setImpTimeCol(cat, idx){ this.setState(s=>({ imp:{ ...s.imp, timeByCat:{ ...s.imp.timeByCat, [cat]: parseInt(idx) } } })); }\n  toggleDayFilterCat(cat){ this.setState(s=>({ imp:{ ...s.imp, filterByTimeByCat:{ ...s.imp.filterByTimeByCat, [cat]:{ ...(s.imp.filterByTimeByCat[cat]||{}), day: !(s.imp.filterByTimeByCat[cat]&&s.imp.filterByTimeByCat[cat].day) } } } })); }\n  toggleNightFilterCat(cat){ this.setState(s=>({ imp:{ ...s.imp, filterByTimeByCat:{ ...s.imp.filterByTimeByCat, [cat]:{ ...(s.imp.filterByTimeByCat[cat]||{}), night: !(s.imp.filterByTimeByCat[cat]&&s.imp.filterByTimeByCat[cat].night) } } } })); }\n  toggleAliasCols(){ this.setState(s=>({ imp:{ ...s.imp, showAliasCols: !s.imp.showAliasCols } })); }\n  toggleColumnMapping(){ this.setState(s=>({ imp:{ ...s.imp, showColumnMapping: !s.imp.showColumnMapping } })); }\n  toggleHideIgnoredCats(){ this.setState(s=>({ imp:{ ...s.imp, hideIgnoredCats: !s.imp.hideIgnoredCats } })); }\n  setImpCatMap(v, cat){ this.setState(s=>({ imp:{ ...s.imp, catMap:{ ...s.imp.catMap, [v]:cat } } })); }\n  toggleFilterVal(v){ this.setState(s=>({ imp:{ ...s.imp, filterVals:{ ...s.imp.filterVals, [v]: !s.imp.filterVals[v] } } })); }\n  clearImp(){ this.setState({ imp:null }); }\n  // ---------- quarterly report (Sort/Receive workspaces only) ----------\n  // Category grouping for Part Type, ported from the Supermarket Dashboard so counts\n  // land in the same buckets leadership already recognizes.\n  QUARTERLY_CATEGORY_MAP = {\n    'DONGLE':'DONGLEs', 'RAM':'RAMs', 'GPU':'GPUs', 'AWS OPTICAL MODULE':'OPTICS',\n    'SWITCH':'SWITCHES', 'AWS SWITCH':'SWITCHES', 'PSU':'PSUs', 'AWS PSU':'PSUs'\n  };\n  QUARTERLY_CATEGORY_ORDER = ['DONGLEs','PSUs','RAMs','SWITCHES','OPTICS','GPUs','MISCELLANEOUS'];\n  QUARTERLY_REQUIRED_COLS = ['Workflow','Part Type','Transaction Date','Last Touch Date','Created By','Last Touch By'];\n  // Uploading a new quarterly file REPLACES ws.quarterly entirely — there's no merge,\n  // so importing Q2's file always overwrites whatever Q1 left behind.\n  async handleQuarterlyFile(file){\n    try{\n      const rows = await this.fileToRows(file);\n      if(!rows.length){ this.setState({ quarterlyError:'The file appears to be empty.' }); return; }\n      const headers = rows[0].map(x=>String(x==null?'':x));\n      const body = rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>{ o[h]=r[i]==null?'':r[i]; }); return o; });\n      const k=this.state.workspace;\n      this.update(d=>{ d.workspaces[k].quarterly = { fileName:file.name, uploadedAt:Date.now(), headers, rows:body }; });\n      this.setState({ quarterlyError:null });\n    }catch(e){ this.setState({ quarterlyError: (e && e.message) || 'Could not read this file.' }); }\n  }\n  clearQuarterly(){ if(!confirm('Remove the imported quarterly file? This clears the data-quality, category, and disposition tracking below.')) return; const k=this.state.workspace; this.update(d=>{ d.workspaces[k].quarterly = null; }); }\n  toggleQuarterlyAlerts(){ this.setState(s=>({ quarterlyAlertsExpanded: !s.quarterlyAlertsExpanded })); }\n  // ---------- FA Shift Dashboard (ported from the FA Ops Suite) ----------\n  faMomentForTime(baseDate, hhmm){ const [h,m]=hhmm.split(':').map(Number); const d=new Date(baseDate.getTime()); d.setHours(h,m,0,0); return d; }\n  faWindow(baseDate, startTime, endTime){ const start=this.faMomentForTime(baseDate,startTime); let end=this.faMomentForTime(baseDate,endTime); if(end.getTime()<=start.getTime()) end=new Date(end.getTime()+86400000); return { start, end }; }\n  faReportDateFromLatest(latestDate){ const d=latestDate; const fourThirty=new Date(d.getFullYear(),d.getMonth(),d.getDate(),4,30,0); let base=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0); if(d.getTime()<fourThirty.getTime()) base=new Date(base.getTime()-86400000); return base; }\n  faShiftReportWindow(reportDate, mode){ const cfg=this.FA_SHIFT_CONFIGS[mode]; return this.faWindow(reportDate, cfg.filterStart, cfg.filterEnd); }\n  faParseDate(v){ if(v==null || v==='') return null; const d=new Date(String(v)); return isNaN(d.getTime()) ? null : d; }\n  // Handles the \"handle new file\" side: replace-on-upload, exactly like Quarterly.\n  async handleFaShiftFile(file){\n    try{\n      const rows = await this.fileToRows(file);\n      if(!rows.length){ this.setState({ faShiftError:'The file appears to be empty.' }); return; }\n      const headers = rows[0].map(x=>String(x==null?'':x));\n      const body = rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>{ o[h]=r[i]==null?'':r[i]; }); return o; });\n      const k='fa';\n      this.update(d=>{ d.workspaces[k].faShift = { fileName:file.name, uploadedAt:Date.now(), headers, rows:body }; });\n      this.setState({ faShiftError:null });\n    }catch(e){ this.setState({ faShiftError: (e && e.message) || 'Could not read this file.' }); }\n  }\n  clearFaShift(){ if(!confirm('Remove the imported shift file? This clears the dashboard below.')) return; this.update(d=>{ d.workspaces.fa.faShift = null; }); }\n  setFaShiftMode(mode){ this.update(d=>{ d.workspaces.fa.faShiftMode = mode; }); }\n  setFaGoal(kind, component, v){ this.update(d=>{ const g=d.workspaces.fa.faGoals; if(kind==='dramScan'||kind==='metalRemoval'){ g[kind]=v; return; } if(!g[kind]) g[kind]={}; g[kind][component]=v; }); }\n  clearFaGoals(){ this.update(d=>{ d.workspaces.fa.faGoals = { tested:{}, packed:{}, dramScan:'', metalRemoval:'' }; }); }\n  // CNC Machine (Bin Analyzer) upload — a second, smaller file separate from the\n  // main shift CSV, replaced wholesale on each upload like everything else FA.\n  async handleBinScanFile(file){\n    try{\n      const rows = await this.fileToRows(file);\n      if(!rows.length){ this.setState({ faShiftError:'The CNC Machine file appears to be empty.' }); return; }\n      const headers = rows[0].map(x=>String(x==null?'':x));\n      const body = rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>{ o[h]=r[i]==null?'':r[i]; }); return o; });\n      this.update(d=>{ d.workspaces.fa.binScan = { fileName:file.name, uploadedAt:Date.now(), headers, rows:body }; });\n      this.setState({ faShiftError:null });\n    }catch(e){ this.setState({ faShiftError: (e && e.message) || 'Could not read the CNC Machine file.' }); }\n  }\n  clearBinScan(){ if(!confirm('Remove the imported CNC Machine data?')) return; this.update(d=>{ d.workspaces.fa.binScan = null; }); }\n  // Machine/tester selection for specific Board stations — a secondary choice\n  // alongside the normal path assignment, per builder per day.\n  setMachineAssign(day, builderId, machine){ this.update(d=>{ const ws=d.workspaces.fa; if(!ws.machineAssign) ws.machineAssign={}; if(!ws.machineAssign[day]) ws.machineAssign[day]={}; ws.machineAssign[day][builderId]=machine; }); }\n  addMachineOption(path){ this.update(d=>{ const ws=d.workspaces.fa; if(!ws.machineOptions[path]) ws.machineOptions[path]=[]; ws.machineOptions[path].push(''); }); }\n  setMachineOptionName(path, i, v){ this.update(d=>{ const ws=d.workspaces.fa; if(ws.machineOptions[path]) ws.machineOptions[path][i]=v; }); }\n  removeMachineOption(path, i){ this.update(d=>{ const ws=d.workspaces.fa; if(ws.machineOptions[path]) ws.machineOptions[path].splice(i,1); }); }\n  // Ported from the Bin Analyzer tool: groups scans by bin, windowed to the SAME\n  // report date/shift as the main dashboard, using the schedule window (not the\n  // wider filter window) since that's what the original tool used.\n  computeBinScanReport(wsFa, mode){\n    const binScan = wsFa.binScan;\n    const rows = binScan.rows;\n    const missingRequiredColumns = this.BIN_REQUIRED_COLUMNS.filter(c=>binScan.headers.indexOf(c)<0);\n    const candidates=[]; let invalidDates=0;\n    rows.forEach(row=>{\n      const moment = this.faParseDate(row['Last Touch Date']);\n      if (!moment){ invalidDates++; return; }\n      candidates.push({\n        serial:String(row['SerialNumber']||'').trim(), partType:String(row['Part Type']||'').trim().toUpperCase()||'UNKNOWN',\n        binId:String(row['Bin ID']||'').trim()||'NO BIN ID', builder:String(row['Last Touch By']||'').trim(), moment\n      });\n    });\n    let scoped=[], reportDate=null, win=null;\n    if (candidates.length){\n      const latest = candidates.reduce((a,b)=> b.moment.getTime()>a.getTime()?b.moment:a, candidates[0].moment);\n      reportDate = this.faReportDateFromLatest(latest);\n      const cfg = this.FA_SHIFT_CONFIGS[mode];\n      win = this.faWindow(reportDate, cfg.scheduleStart, cfg.scheduleEnd);\n      scoped = candidates.filter(r=> r.moment.getTime()>=win.start.getTime() && r.moment.getTime()<=win.end.getTime());\n    }\n    const uniqueSerials = new Set(scoped.map(r=>r.serial).filter(Boolean));\n    const uniqueBins = new Set(scoped.map(r=>r.binId).filter(Boolean));\n    const uniquePartTypes = new Set(scoped.map(r=>r.partType).filter(Boolean));\n    const sortedMoments = scoped.map(r=>r.moment).sort((a,b)=>a.getTime()-b.getTime());\n    const partCounts={};\n    scoped.forEach(r=>{ if(!partCounts[r.partType]) partCounts[r.partType]={ count:0, bins:new Set() }; partCounts[r.partType].count++; partCounts[r.partType].bins.add(r.binId); });\n    const partRows = Object.entries(partCounts).sort((a,b)=>b[1].count-a[1].count || a[0].localeCompare(b[0]))\n      .map(([partType,v])=>({ partType, count:v.count, bins:v.bins.size }));\n    const alerts=[];\n    if (missingRequiredColumns.length) alerts.push('Missing required column(s): '+missingRequiredColumns.join(', ')+'.');\n    if (invalidDates>0) alerts.push(invalidDates+' row(s) ignored because Last Touch Date could not be parsed.');\n    return {\n      fileName:binScan.fileName, uploadedAt:binScan.uploadedAt,\n      windowLabel: reportDate ? (this.faFormatDate(reportDate)+' '+this.FA_SHIFT_CONFIGS[mode].label) : '-',\n      uniqueSerialCount: uniqueSerials.size, uniqueBinCount: uniqueBins.size, uniquePartTypeCount: uniquePartTypes.size,\n      firstScanLabel: sortedMoments[0] ? this.faFormatTime(sortedMoments[0]) : '-',\n      lastScanLabel: sortedMoments.length ? this.faFormatTime(sortedMoments[sortedMoments.length-1]) : '-',\n      partRows, alerts, hasAlerts: alerts.length>0, hasData: scoped.length>0\n    };\n  }\n  // Pulls the CURRENT day's Goals-tab achieved numbers straight from the Shift\n  // Dashboard's own rigorous classification (tested/packed/CNC/sanitized), the same\n  // way that tab computes its own totals — instead of the generic CSV-row-counting\n  // every other workspace's Contributions import uses.\n  pullFaGoalsFromDashboard(){\n    const d = this.state.data;\n    const wsFa = d.workspaces.fa;\n    if (!wsFa.faShift) return;\n    const mode = wsFa.faShiftMode || 'night';\n    const report = this.computeFaShiftReport(wsFa, mode);\n    const day = this.state.day;\n    const byPart = {}; report.partTypeRows.forEach(r=>{ byPart[r.partType] = { tested:r.tested, packed:r.packed }; });\n    // Only paths with an unambiguous single achieved number get filled — DIMM/RAM's\n    // SLT stations and DIMM Tester .FA_SUMMARY_PART_TYPES.flatMap(pt=>{ const p=partsByType[pt]||{tested:0,pass:0,fail:0,retest:0,packed:0};\n        const failPct = p.tested>0 ? (p.fail/p.tested*100).toFixed(1)+'%' : '0.0%';\n        return [p.pass,p.fail,p.retest,p.tested,failPct,p.packed]; });\n      rows.push([e.user, ...partCols, e.sanitized, e.cnc, e.pass, e.fail, e.retest, e.tested, e.packed, e.cnc, e.passPct+'%', e.failPct+'%', e.rate]);\n    });\n    const csv = rows.map(r=>r.map(v=>'\"'+sanitize(v).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n');\n    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    const dateLabel = report.header && report.header.reportDateLabel!=='-' ? report.header.reportDateLabel.split(' ')[0].replace(/\\//g,'-') : new Date().toISOString().slice(0,10);\n    link.href = url; link.download = 'FA_Lab_Selected_Results_'+dateLabel+'_'+mode+'.csv';\n    document.body.appendChild(link); link.click(); document.body.removeChild(link);\n    URL.revokeObjectURL(url);\n  }\n  toggleFaUser(mode, user, allUsers){ this.update(d=>{ const ws=d.workspaces.fa; if(!ws.faSelectedUsers) ws.faSelectedUsers={ day:null, night:null }; let sel=ws.faSelectedUsers[mode]; if(sel==null) sel=[...allUsers]; const i=sel.indexOf(user); if(i>=0) sel.splice(i,1); else sel.push(user); ws.faSelectedUsers[mode]=sel; }); }\n  faSelectAllUsers(mode, allUsers){ this.update(d=>{ const ws=d.workspaces.fa; if(!ws.faSelectedUsers) ws.faSelectedUsers={ day:null, night:null }; ws.faSelectedUsers[mode] = [...allUsers]; }); }\n  faClearAllUsers(mode){ this.update(d=>{ const ws=d.workspaces.fa; if(!ws.faSelectedUsers) ws.faSelectedUsers={ day:null, night:null }; ws.faSelectedUsers[mode] = []; }); }\n  setFaEmployeeSearch(v){ this.setState({ faEmployeeSearch:v }); }\n  // Builds test/pack/cnc/sanitization row sets, windowed to the selected shift, exactly\n  // mirroring the original workflow/part-type classification and latest-record\n  // deduplication by serial number.\n  computeFaShiftRows(faShift, mode){\n    const rows = faShift.rows;\n    const passesFacility = (r)=> String(r['Facility']||'').trim().toUpperCase().indexOf(this.FA_FACILITY)>=0;\n    let invalidTest=0, invalidPack=0, invalidCnc=0, invalidSanitization=0, excludedFacility=0;\n\n    // ---- test rows ----\n    const testCandidates=[];\n    rows.forEach((row,idx)=>{\n      if(!passesFacility(row)){ excludedFacility++; return; }\n      const workflow=String(row['Workflow']||'').trim().toUpperCase();\n      const partType=String(row['Part Type']||'').trim().toUpperCase();\n      if (workflow!==this.FA_TEST_WORKFLOW || this.FA_TEST_PART_TYPES.indexOf(partType)<0) return;\n      const tester=String(row['Transaction By']||'').trim();\n      const input=String(row['Input']||'').trim().toUpperCase();\n      let outcome='';\n      if (partType==='DONGLE'){ if(input==='PASS-TESTING') outcome='PASS'; else if(input==='FAIL-TESTING') outcome='FAIL'; else if(input==='RETEST-TESTING') outcome='RETEST'; }\n      else { if(input.indexOf('PASS')===0) outcome='PASS'; else if(input.indexOf('FAIL')===0) outcome='FAIL'; else if(input.indexOf('RETEST')===0) outcome='RETEST'; }\n      const txMoment=this.faParseDate(row['Transaction Date']);\n      const touchMoment=this.faParseDate(row['Last Touch Date']);\n      const serial=String(row['SerialNumber']||'').trim();\n      if(!txMoment){ invalidTest++; return; }\n      if(!tester || !outcome) return;\n      testCandidates.push({ tester, outcome, partType, serial, moment:txMoment, compareMoment: touchMoment||txMoment, dedupeKey: serial || ('__NO_SWITCH_SERIAL__'+idx) });\n    });\n    let testRows=[];\n    if (testCandidates.length){\n      const latest = testCandidates.reduce((a,b)=> b.moment.getTime()>a.getTime()?b.moment:a, testCandidates[0].moment);\n      const reportDate = this.faReportDateFromLatest(latest);\n      const win = this.faShiftReportWindow(reportDate, mode);\n      const scoped = testCandidates.filter(r=> r.moment.getTime()>=win.start.getTime() && r.moment.getTime()<=win.end.getTime());\n      const nonSwitch = scoped.filter(r=>r.partType!==this.FA_SWITCH_PART_TYPE);\n      const switchRows = scoped.filter(r=>r.partType===this.FA_SWITCH_PART_TYPE);\n      const latestSwitch = new Map();\n      switchRows.forEach(r=>{ const ex=latestSwitch.get(r.dedupeKey); if(!ex || r.compareMoment.getTime()>ex.compareMoment.getTime()) latestSwitch.set(r.dedupeKey, r); });\n      testRows = [...nonSwitch, ...latestSwitch.values()].sort((a,b)=>a.moment.getTime()-b.moment.getTime());\n    }\n\n    // ---- pack rows ----\n    const packCandidates=[];\n    rows.forEach((row,idx)=>{\n      if(!passesFacility(row)) return;\n      const workflow=String(row['Workflow']||'').trim().toUpperCase();\n      const partType=String(row['Part Type']||'').trim().toUpperCase();\n      const outboundType=String(row['Outbound Removal Type']||'').trim().toUpperCase();\n      const outboundDest=String(row['Outbound Destination']||'').trim();\n      const packer=String(row['Last Touch By']||'').trim();\n      const serial=String(row['SerialNumber']||'').trim();\n      const isCpuPack = partType===this.FA_CPU_PART_TYPE && this.FA_CPU_PACK_TYPES.indexOf(outboundType)>=0 && outboundDest!=='';\n      const isStdPack = this.FA_TEST_PART_TYPES.indexOf(partType)>=0 && this.FA_PACK_TYPES.indexOf(outboundType)>=0;\n      if (workflow!==this.FA_PACK_WORKFLOW || !packer) return;\n      if (!isStdPack && !isCpuPack) return;\n      const touchMoment=this.faParseDate(row['Last Touch Date']);\n      if(!touchMoment){ invalidPack++; return; }\n      packCandidates.push({ packer, partType, serial, moment:touchMoment, dedupeKey: serial || ('__NO_SERIAL__'+idx) });\n    });\n    let packRows=[];\n    if (packCandidates.length){\n      const latest = packCandidates.reduce((a,b)=> b.moment.getTime()>a.getTime()?b.moment:a, packCandidates[0].moment);\n      const reportDate = this.faReportDateFromLatest(latest);\n      const win = this.faShiftReportWindow(reportDate, mode);\n      const scoped = packCandidates.filter(r=> r.moment.getTime()>=win.start.getTime() && r.moment.getTime()<=win.end.getTime());\n      const latestBySerial = new Map();\n      scoped.forEach(r=>{ const ex=latestBySerial.get(r.dedupeKey); if(!ex || r.moment.getTime()>ex.moment.getTime()) latestBySerial.set(r.dedupeKey, r); });\n      packRows = [...latestBySerial.values()].sort((a,b)=>a.moment.getTime()-b.moment.getTime());\n    }\n\n    // ---- cnc rows (DRAM scans + dongle card cuts) ----\n    const cncCandidates=[];\n    rows.forEach(row=>{\n      if(!passesFacility(row)) return;\n      const workflow=String(row['Workflow']||'').trim().toUpperCase();\n      const partType=String(row['Part Type']||'').trim().toUpperCase();\n      const input=String(row['Input']||'').trim().toUpperCase();\n      const isDramCnc = workflow===this.FA_CNC_WORKFLOW && partType===this.FA_CNC_PART_TYPE;\n      const isDongleCard = partType==='DONGLE' && (input==='PASS-CNC' || input==='FAIL-CNC');\n      if (!isDramCnc && !isDongleCard) return;\n      const builder = isDongleCard ? String(row['Transaction By']||'').trim() : String(row['Created By']||'').trim();\n      if (!builder) return;\n      const txMoment=this.faParseDate(row['Transaction Date']);\n      if(!txMoment){ invalidCnc++; return; }\n      cncCandidates.push({ builder, partType, cncType: isDongleCard?'CARD':'DRAM', moment:txMoment });\n    });\n    let cncRows=[];\n    if (cncCandidates.length){\n      const latest = cncCandidates.reduce((a,b)=> b.moment.getTime()>a.getTime()?b.moment:a, cncCandidates[0].moment);\n      const reportDate = this.faReportDateFromLatest(latest);\n      const win = this.faShiftReportWindow(reportDate, mode);\n      cncRows = cncCandidates.filter(r=> r.moment.getTime()>=win.start.getTime() && r.moment.getTime()<=win.end.getTime());\n    }\n\n    // ---- sanitization rows ----\n    const sanCandidates=[];\n    rows.forEach(row=>{\n      if(!passesFacility(row)) return;\n      const workflow=String(row['Workflow']||'').trim().toUpperCase();\n      const partType=String(row['Part Type']||'').trim();\n      const builder=String(row['Last Touch By']||'').trim();\n      if (workflow!==this.FA_SANITIZATION_WORKFLOW || !partType || !builder) return;\n      const touchMoment=this.faParseDate(row['Last Touch Date']);\n      if(!touchMoment){ invalidSanitization++; return; }\n      sanCandidates.push({ builder, partType, moment:touchMoment });\n    });\n    let sanitizationRows=[];\n    if (sanCandidates.length){\n      const latest = sanCandidates.reduce((a,b)=> b.moment.getTime()>a.getTime()?b.moment:a, sanCandidates[0].moment);\n      const reportDate = this.faReportDateFromLatest(latest);\n      const win = this.faShiftReportWindow(reportDate, mode);\n      sanitizationRows = sanCandidates.filter(r=> r.moment.getTime()>=win.start.getTime() && r.moment.getTime()<=win.end.getTime());\n    }\n\n    const allMoments=[...testRows.map(r=>r.moment), ...packRows.map(r=>r.moment), ...cncRows.map(r=>r.moment), ...sanitizationRows.map(r=>r.moment)].sort((a,b)=>a.getTime()-b.getTime());\n    const currentTime = allMoments.length ? allMoments[allMoments.length-1] : null;\n    const currentReportDate = currentTime ? this.faReportDateFromLatest(currentTime) : null;\n\n    return { testRows, packRows, cncRows, sanitizationRows, currentTime, currentReportDate,\n      dataQuality: { missingRequiredColumns: this.FA_REQUIRED_COLUMNS.filter(c=>headers_missing(faShift.headers,c)),\n        totalRowsLoaded: rows.length, invalidTest, invalidPack, invalidCnc, invalidSanitization, excludedFacility } };\n    function headers_missing(headers, col){ return headers.indexOf(col)<0; }\n  }\n  faGetTotalWorkedHours(mode, currentReportDate, currentTime){\n    if (!currentReportDate || !currentTime) return 0;\n    const cfg=this.FA_SHIFT_CONFIGS[mode]; let total=0;\n    cfg.periods.forEach(p=>{ const win=this.faWindow(currentReportDate, p.countStart, p.countEnd);\n      if (currentTime.getTime()>win.start.getTime()){ if(currentTime.getTime()<win.end.getTime()) total += (currentTime.getTime()-win.start.getTime())/3600000; else total += (win.end.getTime()-win.start.getTime())/3600000; } });\n    return total;\n  }\n  // Aggregates the windowed rows into everything the dashboard shows: KPIs, the\n  // part-type table, sanitization/CNC panels, period summaries, goal-tracker\n  // actuals, and per-employee breakdowns — filtered to the selected builders.\n  computeFaShiftReport(ws, mode){\n    const faShift = ws.faShift;\n    const built = this.computeFaShiftRows(faShift, mode);\n    const { testRows, packRows, cncRows, sanitizationRows, currentTime, currentReportDate, dataQuality } = built;\n    const allUsers = Array.from(new Set([...testRows.map(r=>r.tester), ...packRows.map(r=>r.packer), ...cncRows.map(r=>r.builder), ...sanitizationRows.map(r=>r.builder)])).filter(Boolean).sort((a,b)=>a.localeCompare(b));\n    const savedSel = (ws.faSelectedUsers||{})[mode];\n    const selectedUsers = savedSel==null ? new Set(allUsers) : (savedSel.length===0 ? new Set() : new Set(allUsers.filter(u=>savedSel.indexOf(u)>=0)));\n\n    const visTest = testRows.filter(r=>selectedUsers.has(r.tester));\n    const visPack = packRows.filter(r=>selectedUsers.has(r.packer));\n    const visCnc = cncRows.filter(r=>selectedUsers.has(r.builder));\n    const visSan = sanitizationRows.filter(r=>selectedUsers.has(r.builder));\n\n    const builderData={}; const ensureBuilder=(u)=>{ if(!builderData[u]) builderData[u]={ tested:0,pass:0,fail:0,retest:0,packed:0,cnc:0,sanitized:0,parts:{} }; return builderData[u]; };\n    const ensurePart=(b,pt)=>{ if(!b.parts[pt]) b.parts[pt]={ tested:0,pass:0,fail:0,retest:0,packed:0,cnc:0,sanitized:0 }; return b.parts[pt]; };\n    const partTypeCounts={}; this.FA_SUMMARY_PART_TYPES.forEach(pt=>{ partTypeCounts[pt]={ pass:0,fail:0,retest:0,tested:0,packed:0 }; });\n    let totalTested=0, totalPass=0, totalFail=0, totalRetest=0, totalPacked=0, totalCnc=0, totalSanitized=0, totalDramCnc=0, totalCardCnc=0;\n\n    visTest.forEach(r=>{ const b=ensureBuilder(r.tester), p=ensurePart(b,r.partType);\n      b.tested++; p.tested++; if(partTypeCounts[r.partType]) partTypeCounts[r.partType].tested++; totalTested++;\n      if(r.outcome==='PASS'){ b.pass++; p.pass++; if(partTypeCounts[r.partType]) partTypeCounts[r.partType].pass++; totalPass++; }\n      else if(r.outcome==='FAIL'){ b.fail++; p.fail++; if(partTypeCounts[r.partType]) partTypeCounts[r.partType].fail++; totalFail++; }\n      else if(r.outcome==='RETEST'){ b.retest++; p.retest++; if(partTypeCounts[r.partType]) partTypeCounts[r.partType].retest++; totalRetest++; }\n    });\n    visPack.forEach(r=>{ const b=ensureBuilder(r.packer), p=ensurePart(b,r.partType);\n      if(!partTypeCounts[r.partType]) partTypeCounts[r.partType]={pass:0,fail:0,retest:0,tested:0,packed:0};\n      b.packed++; p.packed++; partTypeCounts[r.partType].packed++; totalPacked++;\n    });\n    const cncByBuilder={};\n    visCnc.forEach(r=>{ const b=ensureBuilder(r.builder), p=ensurePart(b,r.partType);\n      b.cnc++; p.cnc++; totalCnc++;\n      if(!cncByBuilder[r.builder]) cncByBuilder[r.builder]={ dram:0, cards:0 };\n      if(r.cncType==='CARD'){ cncByBuilder[r.builder].cards++; totalCardCnc++; } else { cncByBuilder[r.builder].dram++; totalDramCnc++; }\n    });\n    const sanitizationCounts={};\n    visSan.forEach(r=>{ const b=ensureBuilder(r.builder), p=ensurePart(b,r.partType);\n      b.sanitized++; p.sanitized++; sanitizationCounts[r.partType]=(sanitizationCounts[r.partType]||0)+1; totalSanitized++;\n    });\n\n    const totalTimeWorked = this.faGetTotalWorkedHours(mode, currentReportDate, currentTime);\n    const passRate = totalTested>0 ? (totalPass/totalTested*100) : 0;\n\n    const cfg=this.FA_SHIFT_CONFIGS[mode];\n    const periodData = cfg.periods.map(period=>{\n      let tested=0, packed=0, cnc=0, sanitized=0, pass=0, fail=0, retest=0, timeWorked=0;\n      if (currentReportDate){\n        const win=this.faWindow(currentReportDate, period.countStart, period.countEnd);\n        const within=(m)=> m.getTime()>=win.start.getTime() && m.getTime()<win.end.getTime();\n        visTest.forEach(r=>{ if(within(r.moment)){ tested++; if(r.outcome==='PASS') pass++; else if(r.outcome==='FAIL') fail++; else if(r.outcome==='RETEST') retest++; } });\n        visPack.forEach(r=>{ if(within(r.moment)) packed++; });\n        visCnc.forEach(r=>{ if(within(r.moment)) cnc++; });\n        visSan.forEach(r=>{ if(within(r.moment)) sanitized++; });\n        if (currentTime && currentTime.getTime()>win.start.getTime()){ if(currentTime.getTime()<win.end.getTime()) timeWorked=(currentTime.getTime()-win.start.getTime())/3600000; else timeWorked=(win.end.getTime()-win.start.getTime())/3600000; }\n      }\n      const activity=tested+packed+cnc+sanitized;\n      return { name:period.name, tested, packed, cnc, sanitized, pass, fail, retest, activity, rate: timeWorked>0 ? tested/timeWorked : 0 };\n    });\n    const maxPeriodActivity = Math.max(...periodData.map(p=>p.activity), 1);\n    periodData.forEach(p=>{ p.barPct = Math.round(p.activity/maxPeriodActivity*100); });\n    const topPeriod = [...periodData].sort((a,b)=>b.activity-a.activity)[0] || null;\n\n    const insights=[];\n    if (topPeriod && topPeriod.activity>0) insights.push(topPeriod.name+' is currently leading with '+topPeriod.tested+' tested, '+topPeriod.packed+' packed, '+topPeriod.cnc+' DRAM scanned, and '+topPeriod.sanitized+' sanitized parts.');\n    if (selectedUsers.size>0) insights.push(selectedUsers.size+' builder'+(selectedUsers.size===1?'':'s')+' selected, with '+totalPass+' passes, '+totalFail+' fails, '+totalRetest+' retests, '+totalPacked+' packed parts, '+totalCnc+' DRAM scanned, and '+totalSanitized+' sanitized parts.');\n    if (currentReportDate && currentTime) insights.push('Latest activity is '+this.faFormatTime(curr
