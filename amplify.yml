version: 1
backend:
  phases:
    build:
      commands:
        # npm install (not npm ci): Amplify's own packages bundle a dependency whose
        # sub-dependency npm ci always reports as "missing from lock file", even with a
        # freshly generated lock. npm install still honors package-lock.json.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
